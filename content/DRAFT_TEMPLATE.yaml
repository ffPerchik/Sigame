# ----------------------------------------------------------------------------
# ФИНАЛ (опционально) — type: final. В финале игроки делают ставки.
# ----------------------------------------------------------------------------
- name: "Финал"
  type: final
  themes:
    - name: "Тема финала"
      questions:
        - price: 0           # в финале цена не существенна
          say: "Финальный вопрос..."
          answers: ["..."]
