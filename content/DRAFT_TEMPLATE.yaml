# ============================================================================
#  ШАБЛОН ЗАГОТОВКИ — впишите сюда свои темы и вопросы.
#
#  Скопируйте нужные блоки. После того как вы закоммитите свой вариант
#  (или пришлёте текстом), я встрою темы в content/package.yaml и пересоберу
#  пакет. Формат не строгий — если у вас уже есть заготовка в другом виде,
#  просто положите её рядом, я разберусь.
#
#  Поля вопроса (все опциональны, кроме price и ответа):
#    price      — цена вопроса (обязательно)
#    say        — текст, который читает ведущий
#    text       — крупный текст на экране (если нужен)
#    image      — файл из content/Images/ (положите картинку туда)
#    answers    — список принимаемых ответов (любой = верно)
#    answer     — если ответ один
#    wrong      — неверные варианты (для режима «выбор ответа»)
#    type       — simple (по умолчанию) | auction | cat | bagcat | sponsored | table
#    comment    — заметка для ведущего
# ============================================================================

# ----------------------------------------------------------------------------
# ПОЛНОСТЬЮ ТЕМАТИЧЕСКИЙ РАУНД «ГЕОГРАФИЯ»
# В тематическом раунде ВСЕ темы — про одно (здесь: географию).
# Заполните подтемы и вопросы под себя.
# ----------------------------------------------------------------------------
- name: "Раунд — География"
  type: standart
  themes:
    - name: "Столицы"
      questions:
        - price: 10
          say: "Столица Франции."
          answers: ["Париж"]
        - price: 20
          say: "..."
          answers: ["..."]

    - name: "Реки и озёра"
      questions:
        - price: 10
          say: "..."
          answers: ["..."]

    - name: "Горы и вершины"
      questions:
        - price: 10
          say: "..."
          answers: ["..."]

    - name: "Флаги и страны"
      questions:
        - price: 10
          say: "..."
          answers: ["..."]

    - name: "Географические рекорды"
      questions:
        - price: 10
          say: "..."
          answers: ["..."]

# ----------------------------------------------------------------------------
