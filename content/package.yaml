# ============================================================================
#  Источник пакета SIGame «Своя игра для друзей»
#  Формат: round -> themes -> questions. Каждая тема может иметь ЛЮБОЕ число
#  вопросов (у вас «фиксированный список» — ок, просто перечислите их).
#
#  Поля вопроса:
#    price      — цена (целое), обязательна
#    say        — текст, который читает ведущий (реплика)
#    text       — текст на экране (если нужен отдельно)
#    image      — имя файла из content/Images/ (показывается в вопросе)
#    answer_image — картинка, показываемая ПРИ ОТВЕТЕ (после маркера)
#    answers    — список принимаемых ответов (любой из них = верно)
#    answer     — короткая форма, если ответ один
#    wrong      — неверные варианты (для режима «выбор ответа»)
#    type       — тип вопроса (по умолчанию simple). Возможны: simple,
#                 auction, cat, bagcat, sponsored, table
#    comment    — комментарий для ведущего (не виден игрокам)
#
#  Чтобы добавить свой медиафайл: положите его в content/Images/ (или Audio/,
#  Video/) и сошлитесь по имени в image/voice/video.
# ============================================================================

package:
  name: "Своя игра для друзей"
  language: ru
  difficulty: 4
  date: "2026-08-11"
  author: "Хозяин игры"          # ← впишите своё имя
  tags: ["Для друзей", "Вечеринка"]
  comments: >
    Пакет для игры втроём (каждый сам за себя). После игры стартует
    индивидуальный ARG-квест. Структура раундов дополняется заготовкой
    игрока (география + прочие темы).

  rounds:
    # =========================================================================
    # РАУНД 1 — разогрев. Две темы, которые собраны полностью.
    # Остальные раунды (включая полностью тематический «География») будут
    # добавлены из заготовки игрока — см. content/DRAFT_TEMPLATE.yaml
    # =========================================================================
    - name: "Раунд 1 — На разогреве"
      type: standart
      themes:
        # -------------------------------------------------------------------
        # ТЕМА: Армянская еда (собрана агентом: фото блюда → название)
        # -------------------------------------------------------------------
        - name: "Армянская еда"
          comment: "Узнай блюдо по фото. Принимаются основные варианты названий."
          questions:
            - price: 10
              say: "Назовите этот тонкий армянский хлеб, который выпекают в тони́ре. В 2014 году он попал в список нематериального культурного наследия ЮНЕСКО."
              image: arm-lavash.jpg
              answers: ["Лаваш"]

            - price: 20
              say: "В молодые виноградные листья заворачивают фарш с рисом и зеленью. Что это за блюдо?"
              image: arm-dolma.jpg
              answers: ["Долма", "Толма"]

            - price: 30
              say: "Как армяне называют шашлык — мясо, жаренное на углях?"
              image: arm-khorovats.jpg
              answers: ["Хоровац", "Хоровадз"]

            - price: 40
              say: "Эти гладкие мясные шары делают из тщательно отбитой телятины с яйцом и водой. Назовите блюдо."
              image: arm-kufta.jpg
              answers: ["Кюфта"]

            - price: 50
              say: "Праздничное блюдо: целая тыква, фаршированная рисом, сухофруктами и мёдом, запечённая в печи. Как оно называется?"
              image: arm-ghapama.jpg
              answers: ["Хапама", "Гапама", "Капама"]

        # -------------------------------------------------------------------
        # ТЕМА: BTS — 1 фото = 1 участник (7 человек)
        # -------------------------------------------------------------------
        - name: "BTS"
          comment: "Одно фото — один участник. Засчитывается сценическое или настоящее имя."
          questions:
            - price: 10
              say: "Назовите участника группы BTS."
              image: bts-rm.jpg
              answers: ["RM", "Ким Намджун", "Намджун", "Ким Нам-джун"]
            - price: 20
              say: "Назовите участника группы BTS."
              image: bts-jin.jpg
              answers: ["Jin", "Джин", "Ким Сокджин", "Сокджин"]
            - price: 30
              say: "Назовите участника группы BTS."
              image: bts-suga.jpg
              answers: ["Suga", "Шуга", "Мин Юнги", "Юнги", "Агуст D", "Agust D"]
            - price: 40
              say: "Назовите участника группы BTS."
              image: bts-jhope.jpg
              answers: ["J-Hope", "Джей-Хоуп", "Чон Хосок", "Хосок", "Хоби"]
            - price: 50
              say: "Назовите участника группы BTS."
              image: bts-jimin.jpg
              answers: ["Jimin", "Чимин", "Пак Чимин"]
            - price: 60
              say: "Назовите участника группы BTS."
              image: bts-v.jpg
              answers: ["V", "Ви", "Ким Тэхён", "Тэхён"]
            - price: 70
              say: "Назовите участника группы BTS."
              image: bts-jungkook.jpg
              answers: ["Jungkook", "Чонгук", "Чон Чонгук", "Golden Maknae"]
