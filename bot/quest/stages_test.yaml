# =============================================================================
#  Тестовый сценарий для проверки фич бота (хаб, медиа, все режимы).
#  Загружается через ENV: QUEST_FILE=bot/quest/stages_test.yaml
#  ENTRY_CODE=ZENGAME2026
# =============================================================================
entry_code: "ZENGAME2026"

welcome:
  text: |
    ┌── TEST MODE ──┐
    Это тестовый режим. Все фичи бота можно проверить здесь.
    Жди апрува ведущего, потом — в хаб с кнопками.

nodes:
  N1: {label: "СНИМОК С КООРДИНАТОЙ", hint: "EXIF-фото"}
  N2: {label: "ГОЛОС В СПЕКТРЕ", hint: "Аудио-спектрограмма"}
  N3: {label: "ТЕСТ-МЕДИА", hint: "Картинка/аудио/видео"}

stages:

  start_gate:
    mode: gate
    text: |
      Ожидай подтверждения ведущего (тестовый режим).

  prologue:
    mode: info
    text: |
      ТЕСТОВЫЙ ПРОЛОГ
      Сейчас ты попадёшь в хаб и сможешь выбрать узел.
    next: hub

  # ---- N1: auto-ответ ----
  N1_intro:
    mode: info
    text: |
      ТЕСТ: Узел N1
      Просто введи слово «тест» (без кавычек).
    next: N1_question

  N1_question:
    mode: auto
    text: "Введи: тест"
    accept:
      - "тест"
      - "ТЕСТ"
      - "Тест"
    hint: Попробуй написать «тест».
    next: N1_fragment

  N1_fragment:
    mode: info
    text: |
      N1 пройден ✅
    next: hub

  # ---- N2: approve-сабмит ----
  N2_intro:
    mode: info
    text: |
      ТЕСТ: Узел N2 (апрув)
      Пришли любое фото или текст — ведущий одобрит.
    next: N2_approve

  N2_approve:
    mode: approve
    text: |
      Пришли что-нибудь — ведущий проверит.
    hint: Просто отправь сообщение :)
    next: N2_fragment

  N2_fragment:
    mode: info
    text: |
      N2 пройден ✅
    next: hub

  # ---- N3: медиа (картинка + аудио) ----
  N3_intro:
    mode: info
    text: |
      ТЕСТ: Узел N3 (медиа)
      Сейчас придёт картинка. Посмотри и введи слово «медиа».
    image: n3_page1.png
    next: N3_question

  N3_question:
    mode: auto
    text: Какое слово на картинке?
    accept:
      - "медиа"
      - "Медиа"
    hint: Под картинкой текст «ИЩИ». Но ответь «медиа».
    next: N3_fragment

  N3_fragment:
    mode: info
    text: |
      N3 пройден ✅
    next: hub

  # ---- финал-заглушка ----
  final_hint:
    mode: finish
    text: |
      ┌─ ТЕСТ ЗАВЕРШЁН ─┐
      Все узлы пройдены! 🎉