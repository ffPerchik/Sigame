# ARG «Аргус-1001» — хаб, 6 независимых узлов.
# Каждый узел — несколько слоёв. Фрагменты собираются только в финале.
entry_code: "ARGUS1001"

welcome:
  text: |
    ┌────────────────────────────────────────────────────────────────┐
    │  ARGVS-1001 · СЕАНС ПЕРЕХВАЧЕН                                 │
    └────────────────────────────────────────────────────────────────┘

    Ты нашёл вход. Шесть узлов, шесть слоёв и в каждом своя загадка.
    В каждом узле смотри глубже, чем кажется.

    Мы вернёмся, когда придёт время

nodes:
  N1: {label: "СЛОИ СНИМКА", hint: "надпись на кадре · EXIF · хвост JPEG"}
  N2: {label: "ЭХО", hint: "реверс · морзе · спектр · фибоначчи"}
  N3: {label: "ТЕТРАДЬ", hint: "пигпен · изгородь · виженер · книга"}
  N4: {label: "ОДИН КАДР", hint: "вывески · hex-вспышка · обломки"}
  N5: {label: "СЧЁТ", hint: "двоичка · квадрат · исходник · замок"}
  N6: {label: "ЧЕТЫРЕ ЩЕКОЛДЫ", hint: "A1Z26 · атбаш · рельсы · виженер"}

stages:

  prologue:
    mode: info
    text: |
      ┌────────────────────────────────────────────────────────────────┐
      │  ARGVS-1001 · ШЕСТЬ СЛОЁВ                                      │
      └────────────────────────────────────────────────────────────────┘

      Каждый узел отдаёт один фрагмент. Один фрагмент — шум.
      Все шесть — инструкция.

      Подсказки есть, но они не всегда спасают. Думайте.
    next: hub

  # ============================== N1 ==============================
  N1_intro:
    mode: info
    text: |
      ┌─ Узел 1 · СЛОИ СНИМКА ─┐

      Мы перехватили этот кадр. Для начала проверим, что кадр дошёл до тебя. 
    document: n1_card.jpg
    next: N1_flip

  N1_flip:
    mode: auto
    text: |
      Есть ли ты что-то интересное, может кака-то фраза?
    accept:
      - "СМОТРИ ВНУТРЬ"
      - "смотри внутрь"
    hint: |
      Надпись на экране монитора, зелёным. Буквы идут задом наперёд.
      Должно получиться повелительное наклонение и наречие.
    next: N1_exif

  N1_exif:
    mode: auto
    text: |
      Отлично, ты не безнадёжен, но дальше ты сам. Картинка у тебя есть, веселись.
      Подскажу в конце: внутрь — это не про пиксели.
    accept:
      - "255,217"
      - "255, 217"
      - "255 217"
      - "FFD9"
      - "ffd9"
      - "FF D9"
    hint: |
      Автор: 255,217. Это байты в десятичном виде. В hex это FF D9 —
      стандартный маркер конца JPEG. Ищи его в файле.
    next: N1_word

  N1_word:
    mode: auto
    text: |
      Что бы значили эти числа?
    accept:
      - "СЛОИ"
      - "слои"
    hint: |
      Открой jpeg через блокнот и найди строку `secret code`.
    next: N1_fragment

  N1_fragment:
    mode: info
    text: |
      Фрагмент 1 из 6:

         ██████  ОТКРОЙ  ██████
    next: hub

  # ============================== N2 ==============================
  N2_intro:
    mode: info
    text: |
      ┌─ Узел 2 · ЭХО ─┐

      Первый файл звучит как мусор. Он им и должен звучать —
      пока ты не перевернёшь время.
    next: N2_revfile

  N2_revfile:
    mode: info
    text: |
      Скачай, разверни (Audacity → Effect → Reverse) и слушай.
      Это не речь. Это азбука, которой стучат.
    audio: n2_reversed.wav
    next: N2_morse

  N2_morse:
    mode: auto
    text: |
      Что постучали азбукой Морзе после реверса? Одно слово.
    accept:
      - "КЛЮЧ"
      - "ключ"
    hint: |
      Русский Морзе: К=-.-  Л=.-..  Ю=..--  Ч=---.
      Точка короткая, тире втрое длиннее. Между буквами пауза.
    next: N2_specinfo

  N2_specinfo:
    mode: info
    text: |
      Второй файл. Не слушай — смотри спектрограмму
      (Audacity, окно ≥ 1024; Spek; Sonic Visualiser).
    audio: n2_spec.wav
    next: N2_spec

  N2_spec:
    mode: auto
    text: |
      Четыре буквы на спектре?
    accept:
      - "ФИБО"
      - "фибо"
    hint: |
      Слева направо, частоты снизу вверх. Короткое слово, намёк на ряд.
    next: N2_verseinfo

  N2_verseinfo:
    mode: info
    text: |
      Журнал. Шапка уже намекает, какой ряд брать.
      Нужны первые три ненулевых члена — и первые буквы этих слов.
    image: n2_verse.png
    next: N2_echo

  N2_echo:
    mode: auto
    text: |
      Три буквы из журнала?
    accept:
      - "ЭХО"
      - "эхо"
    hint: |
      Слова 1, 2, 3: ЭТОТ ХРУПКИЙ ОТКЛИК. Не бери 5 и 8 — они для сбивки.
    next: N2_fragment

  N2_fragment:
    mode: info
    text: |
      Фрагмент 2 из 6:

         ██████  УСЛЫШЬ  ██████
    next: hub

  # ============================== N3 ==============================
  N3_intro:
    mode: info
    text: |
      ┌─ Узел 3 · ТЕТРАДЬ ─┐

      Четыре листа. Каждый открывает следующий.
      Лист I — не буквы.
    image: n3_pigpen.png
    next: N3_pig

  N3_pig:
    mode: auto
    text: |
      Слово с листа I (масонский / pigpen). Семь букв, без Ё.
    accept:
      - "РЕШЕТКА"
      - "решетка"
      - "РЕШЁТКА"
      - "решётка"
    hint: |
      Клетки без точки — первые 9 букв (А…И), с точкой — следующие.
      «Х»-семейство — дальше по алфавиту. Образец АБВ нарисован внизу.
    next: N3_railinfo

  N3_railinfo:
    mode: info
    text: |
      Лист II. Три рельса, зигзаг (rail fence).
    image: n3_rail.png
    next: N3_rail

  N3_rail:
    mode: auto
    text: |
      Что получилось после изгороди?
    accept:
      - "ВИЖНЕР"
      - "вижнер"
      - "ВИЖЕНЕР"
      - "VIGENERE"
      - "виженер"
    hint: |
      6 букв, 3 рельса. Пиши зигзагом вниз-вверх, читай по строкам — наоборот:
      разложи шифр по длинам рельсов и собери зигзагом.
      Должно получиться имя шифра (русская транслитерация).
    next: N3_viginfo

  N3_viginfo:
    mode: info
    text: |
      Лист III. Тот шифр, имя которого ты только что собрал.
      Ключ — слово с листа I.
    image: n3_vig.png
    next: N3_vig

  N3_vig:
    mode: auto
    text: |
      Открытый текст листа III?
    accept:
      - "СТРОФА"
      - "строфа"
    hint: |
      Виженер, алфавит 32 без Ё. Ключ РЕШЕТКА.
      Шифр: БЧИУЖК. На каждом шаге вычитай букву ключа.
    next: N3_bookinfo

  N3_bookinfo:
    mode: info
    text: |
      Лист IV. Книжный шифр: строка.слово → первая буква.
    image: n3_book.png
    next: N3_book

  N3_book:
    mode: auto
    text: |
      Шесть букв из строф?
    accept:
      - "ИСТИНА"
      - "истина"
    hint: |
      1.2 иней, 2.3 свет, 3.3 тишина, 4.2 иней, 5.3 ночи, 6.2 архив.
    next: N3_fragment

  N3_fragment:
    mode: info
    text: |
      Фрагмент 3 из 6:

         ██████  ПРОЧИТАЙ  ██████
    next: hub

  # ============================== N4 ==============================
  N4_intro:
    mode: info
    text: |
      ┌─ Узел 4 · ОДИН КАДР ─┐

      Короткое видео. Почти все кадры одинаковые.
      Почти.
    next: N4_vid

  N4_vid:
    mode: info
    text: |
      Смотри покадрово. Пять вывесок — это не декор.
      И есть кадр, которого «не должно быть».
    video: n4_walk.mp4
    next: N4_signs

  N4_signs:
    mode: auto
    text: |
      Пять букв с вывесок слева направо?
    accept:
      - "ЛИНЗА"
      - "линза"
    hint: |
      Б, нет. Пять витрин, на каждой по букве. Если видео не открылось —
      попроси у ведущего кадр n4_signs.png (он же у бота в ассетах, но
      штатно идёт внутри ролика).
    next: N4_hex

  N4_hex:
    mode: auto
    text: |
      Вспышка — hex UTF-8. Какое слово?
    accept:
      - "ТЕНЬ"
      - "тень"
    hint: |
      Строка вида d0a2d095d09dd0ac. Декодируй как UTF-8 hex.
      Кадр один, около середины ролика.
    next: N4_shardsinfo

  N4_shardsinfo:
    mode: info
    text: |
      Обломки метки. Четыре четверти, по букве в каждой.
    image: n4_shards.png
    next: N4_word

  N4_word:
    mode: auto
    text: |
      Что собирается из обломков?
    accept:
      - "КАДР"
      - "кадр"
    hint: |
      Читай четверти как книгу: верх-лево, верх-право, низ-лево, низ-право.
    next: N4_fragment

  N4_fragment:
    mode: info
    text: |
      Фрагмент 4 из 6:

         ██████  НАБЛЮДАЙ  ██████
    next: hub

  # ============================== N5 ==============================
  N5_intro:
    mode: info
    text: |
      ┌─ Узел 5 · СЧЁТ ─┐

      Числа в разных системах — один и тот же разговор.
    image: n5_table.png
    next: N5_bin

  N5_bin:
    mode: auto
    text: |
      Блок I: шесть шестибитных чисел, А=000001. Слово?
    accept:
      - "МОДУЛЬ"
      - "модуль"
    hint: |
      Каждая пачка из 6 бит — номер буквы. 011101 = 13 = М, и так далее.
    next: N5_sq

  N5_sq:
    mode: auto
    text: |
      Блок II: магический квадрат. Чтение по числам 1…9.
      Первые пять значащих букв?
    accept:
      - "ЧИСЛО"
      - "число"
    hint: |
      Клетка с «1» — первая буква, с «2» — вторая. XXXX в конце — мусор.
    next: N5_htmlinfo

  N5_htmlinfo:
    mode: info
    text: |
      Страница без страницы. Смотри не рендер, а исходник.
    document: n5_ledger.html
    next: N5_html

  N5_html:
    mode: auto
    text: |
      Комментарий в HTML — hex UTF-8. Три буквы?
    accept:
      - "ЛОК"
      - "лок"
    hint: |
      <!-- HEX UTF-8: d0bb d0be d0ba -->  → Л О К
    next: N5_lockinfo

  N5_lockinfo:
    mode: info
    text: |
      Замок. Ряд знаком. Нужны четыре цифры «после единиц».
    image: n5_lock.png
    next: N5_lock

  N5_lock:
    mode: auto
    text: |
      Код замка (4 цифры подряд)?
    accept:
      - "2358"
      - "2 3 5 8"
    hint: |
      1 1 2 3 5 8 13 21. Единицы отбрось. Следующие четыре члена — по одной
      цифре каждый: 2, 3, 5, 8.
    next: N5_fragment

  N5_fragment:
    mode: info
    text: |
      Фрагмент 5 из 6:

         ██████  ВЫЧИСЛИ  ██████
    next: hub

  # ============================== N6 ==============================
  N6_intro:
    mode: info
    text: |
      ┌─ Узел 6 · ЧЕТЫРЕ ЩЕКОЛДЫ ─┐

      Одна доска, четыре замка подряд. Выход предыдущего — вход следующего.
    image: n6_locks.png
    next: N6_a1

  N6_a1:
    mode: auto
    text: |
      Щеколда I. Числа → буквы (А=01). Пять букв?
    accept:
      - "ЯНЮЯЗ"
      - "янюяз"
    hint: |
      32-14-31-32-08. Я=32, Н=14, Ю=31, Я=32, З=08.
    next: N6_at

  N6_at:
    mode: auto
    text: |
      Щеколда II. Зеркало алфавита (атбаш) того, что только что получил.
    accept:
      - "АТБАШ"
      - "атбаш"
    hint: |
      А↔Я, Б↔Ю, В↔Э … З↔И. ЯНЮЯЗ → АТБАШ.
    next: N6_rail

  N6_rail:
    mode: auto
    text: |
      Щеколда III. Три рельса, строка на доске. Имя шифра?
    accept:
      - "ВИЖНЕР"
      - "вижнер"
      - "виженер"
      - "ВИЖЕНЕР"
    hint: |
      Шифртекст ВЕИНРЖ, 3 рельса — тот же приём, что лист II тетради.
    next: N6_vig

  N6_vig:
    mode: auto
    text: |
      Щеколда IV. Виженер, ключ — слово щеколды II.
      Открытый текст?
    accept:
      - "ПОРТАЛ"
      - "портал"
    hint: |
      Ключ АТБАШ, шифр ПАСТШЛ, алфавит 32 без Ё.
    next: N6_fragment

  N6_fragment:
    mode: info
    text: |
      Фрагмент 6 из 6:

         ██████  ЗАВЕРШИ  ██████
    next: hub

  final_hint:
    mode: finish
    text: |
      ┌────────────────────────────────────────────────────────────────┐
      │  ARGVS-1001 · СЕАНС ЗАВЕРШЁН                                  │
      └────────────────────────────────────────────────────────────────┘

      Шесть фрагментов:

           ОТКРОЙ · УСЛЫШЬ · ПРОЧИТАЙ · НАБЛЮДАЙ · ВЫЧИСЛИ · ЗАВЕРШИ

      Это не координаты и не пароль от чужой жизни.
      Это инструкция, как смотреть дальше.

      Аргус-1001 замолчал.

       ╲╲╲          ╱╱╱
        ╲╲╲  КОНЕЦ ╱╱╱
         ╲╲╲      ╱╱╱
