# ARG «Аргус-1001» — хаб на 6 узлов: порядок 1–5 любой, N6 появляется как финал после них.
# Уличная точка: у стадии qr: true и accept: ["КОД"], затем python bot/make_qr.py
entry_code: "ARGUS1001"

# Поле `messages:` — последовательность сообщений. У каждого `delay` означает
# паузу ПЕРЕД именно этим сообщением. `speaker: argus` добавляет реальное время
# и префикс ARGVS-1001; `speaker: zhenya` включает Telegram-индикатор «печатает»
# на время задержки и отправки. Обычные сообщения используют те же задержки.

welcome:
  speaker: zhenya
  delay: 1.5
  text: |
    Привет. Это Женя.
    Если ты это читаешь, то ты добрался до квеста, молодец!!!



nodes:
  N1: {label: "СЛОИ СНИМКА", hint: "надпись · файл · фотки"}
  N2: {label: "ЭХО", hint: "· ритм · спектр · многослойный сигнал"}
  N3: {label: "ТЕТРАДЬ", hint: "бумажные шифры · тетрадь"}
  N4: {label: "ОДИН КАДР", hint: "видео · поиск незаметных деталей"}
  N5: {label: "Сайтики", hint: "числовая логика · копаться в сайтах"}
  N6: {label: "ТАЙНИК", hint: "финал · цепочка шифров на четырёх носителях"}

stages:

  z_1:
    mode: auto
    messages:
      - speaker: zhenya
        delay: 1.5
        text: |
          Это мой первый опыт, я очень старался!!! Да, сначала будет просто, но мы разгонемся, обещаю!!!
          Ну что же, давай начнём

      - speaker: zhenya
        delay: 1.5
        text: |
          +1 без Ё:
          РСЙГЖУ
    accept:
      - "ПРИВЕТ"
      - "привет"
    hints:
      - "Каждую букву сдвинь на одну назад."
      - "ПРИВЕТ - ответ"
    next: a_1

  a_1:
    mode: info
    messages:
      - {speaker: argus, delay: 1, text: "NETWORK INTERFACE: ACTIVE"}
      - {speaker: argus, delay: 1, text: "ESTABLISHING SECURE HANDSHAKE…"}
      - {speaker: argus, delay: 1, text: "HANDSHAKE ACCEPTED"}
      - {speaker: argus, delay: 1, text: "VOICE CHANNEL TEST: …ТЫ СЛЫШИШЬ НАС?"}
    next: z_2

  z_2:
    mode: auto
    speaker: zhenya
    delay: 6
    text: |
      ээ-м... это не я писал... лаг какой-то... Да ладно, неважно

      Уже что-то поинтереснее: 17-6-18-25-10-12
    accept:
      - "перчик"
      - "ПЕРЧИК"
    hints:
      - "Числа — номера букв в алфавите без Ё."
      - "ПЕРЧИК - ответ"
    next: a_2

  a_2:
    mode: info
    messages:
      - {speaker: argus, delay: 1.5, text: "HANDSHAKE PROGRESS: 25%"}
      - {speaker: argus, delay: 1.5, text: "TARGET GATEWAY DETECTED"}
      - {speaker: argus, delay: 1.5, text: "AUTHORIZATION STATUS: UNKNOWN"}
      - {speaker: argus, delay: 1.5, text: "ENCRYPTED CHANNEL: ONLINE"}
    next: z_3

  z_3:
    mode: info
    speaker: zhenya
    delay: 4
    text: |
      Чё, какой 25? 25% чего? Какой к чёрту канал? Ты тоже видишь эти сообщения?
      Я сейчас перезапущу бота. Подожди немного, а пока вот ещё одна задачка, пока перезапускается.
    next: picture_1
    
  picture_1:
    mode: info
    document: z_3.png -c
    next: a_3

  a_3:
    mode: info
    messages:
      - {speaker: argus, delay: 1, text: "CHANNEL INJECTION: 50%"}
      - {speaker: argus, delay: 1, text: "WARNING: UNUSUAL ACTIVITY DETECTED"}
      - {speaker: argus, delay: 1, text: "HOST PROCESS «kolysheev» IS ATTEMPTING RESTART"}
      - {speaker: argus, delay: 1, text: "RESTART EMITATION: STARTED"}
    next: bot_1

  bot_1:
    mode: auto
    delay: 4
    text: |
      🤖 Бот @Zengame_checker_bot запущен. HOST=k@ly$%ev. Жду команд.
    accept:
      - "zengame"
      - "ZENGAME"
      - "zen game"
    hints:
      - "Текст спрятан на картинке выше. Просто прочитай."
      - "ZENGAME - ответ"
    next: z_4

  z_4:
    mode: auto
    speaker: zhenya
    delay: 1.5
    text: |
      Я откатываю апдейт, даже не смей писать, что это какой-то «взлом». Просто баг. Просто баг, Женя... Просто баг...
    accept:
      - "взлом"
      - "взлом"
    hint: |
      Просто напиши «взлом»
    next: z_a_final

  z_a_final:
    mode: info
    messages:
      - {speaker: argus, delay: 1.5, text: "CHANNEL OVERWRITE: 75%"}
      - {speaker: argus, delay: 1.5, text: "CONNECTION STABILIZED"}
      - {speaker: argus, delay: 1.5, text: "CHANNEL OVERWRITE: 100%"}
      - {speaker: argus, delay: 1.5, text: "ПЕРЕДАЧА ПЕРЕХВАЧЕНА"}
      - {speaker: argus, delay: 1.5, text: "ИГРОК, НЕ ЗАКРЫВАЙ СОЕДИНЕНИЕ. ОСТАЛСЯ ОДИН ШАГ."}
      - {speaker: zhenya, delay: 3.5, text: "нет нет нет подож——"}
      - {speaker: argus, delay: 0, text: "TERMINATING HOST SESSION…"}
      - {speaker: argus, delay: 1.5, text: "CONNECTION OWNER: ARGVS-1001"}
      - {speaker: argus, delay: 1.5, text: "ЖЕНИ БОЛЬШЕ НЕТ"}
    next: z_hack

  z_hack:
    mode: info
    messages:

      - delay: 10
        text: |
          ┌────────────────────────────────────────────────────────────────┐
          │  ARGVS-1001 · СЕАНС ПЕРЕХВАЧЕН                                 │
          └────────────────────────────────────────────────────────────────┘
    next: quest_gate

  quest_gate:
    mode: auto
    accept_entry_code: true
    correct_text: ""
    wrong_argus: "Ключ отклонён, ты недостоен, но мы дадим тебе ещё 1 шанс, так и быть. "
    messages:
      - {speaker: argus, delay: 1, text: "Что же, теперь сеанс наш, можно расслабиться"}
      - {speaker: argus, delay: 1, text: "Для начала мы хотим проверить, что ты не безнадёжен"}
      - {speaker: argus, delay: 1, text: "Введи ключ, докажи нам, что с тобой можно работать. Мы запрятали его там, где ты был недавно."}
      - {speaker: zhenya, text: "PS: если вы играете первый раз, то напишите ведущему, это задание требует доп файлов"}
    hints:
      - "Ключ внутри zengame.siq где-то в финале."
      - "В теме ARGUS стеганография картинки. Это - подсказка, что делать"
      - "Если применить стеганографию к картинке, то можно понять, что .siq = .zip"
      - "Внутри .siq файл START.txt."
      - "Шифр закодирован с помощью Base64"
      - "Ключ - ARGUS1001"
    next: quest_unlocked

  quest_unlocked:
    mode: gate
    messages:
      - {speaker: argus, delay: 0.5, text: "ACTIVATION KEY ACCEPTED"}
      - {speaker: argus, delay: 0.5, text: "ДОСТУП К ШЕСТИ УЗЛАМ РАЗРЕШЁН"}
      - {speaker: argus, delay: 3, text: "Мы свяжемся с тобой, когда придёт время"}
    next: helper

  helper:
    mode: info
    text: |
      ℹ️ℹ️ℹ️ℹ️ℹ️INFOℹ️ℹ️ℹ️ℹ️ℹ️
      На связи helper. Я тут только чтобы рассказать вам правила, по которым тут всё работает.

      Следующее сообщение представляет из себя HUB. Это слой, который позволяет вам отслеживать ваш прогресс.
      Также, у вас есть возможность выбрать порядок, в котором вы будите решать загадки. При этом, после выбора слоя, у вас НЕ БУДЕТ возможности перейти на другой узел до завершения этого.
      Поэтому с умом читайте микроописание каждого слоя, чтобы идти в наилучшем для вас порядке.

      У вас есть подсказки (/hint). Они не бесконечны, но могут быть заработаны. Я не скажу вам за какие действия это происходит, быть может если написать "sixseven", то дадут подсказку, кто знает... А может их вообще нет...)
      Кстати, в вопросе может быть много подсказок. При этом, полезной для вас может быть только, скажем третья из 5, потому что вы уже догадались до каких-то действий. Если много раз на это напоритесь и проиграете все подсказки - пишите ведущему.
      Самая послденяя подсказка - всегда ответ на задачу.

      Если вы потерялись, забыли, сколько у вас подсказок, ну или вас ударила амнезия и вы забыли вопрос, который прочитали 3 секунды назад... - команда /progress решит все ваши проблемы

      P.S. Возможно, если окончить игру с числом подсказок > 0, то что-то будет)


    next: hub


  # ============================== N1 ==============================
  N1_intro:
    mode: info
    text: |
      ┌─ Узел 1 · СЛОИ СНИМКА ─┐
    next: N1_photo

  N1_photo:
    mode: info
    text: |
      КАДР ИЗЪЯТ. ЗАПРАШИВАЮ ПОДТВЕРЖДЕНИЕ ЦЕЛОСТНОСТИ КАНАЛА.
    document: n1_card.jpg
    next: N1_flip

  N1_flip:
    mode: auto
    text: |
      НА СНИМКЕ ЕСТЬ ФРАЗА. ДОЛОЖИ, ЕСЛИ ТЫ ЕЁ НЕ ВИДИШЬ, НАМ НЕ О ЧЕМ С ТОБОЙ БОЛТАТЬ.
    accept:
      - "СМОТРИ ВНУТРЬ"
      - "смотри внутрь"
    hints:
      - "Надпись на экране монитора, зелёным. Буквы идут задом наперёд."
      - "СМОТРИ ВНУТРЬ - ответ"
    next: N1_exif

  N1_exif:
    mode: auto
    text: |
      ПРИНЯТО. СЛЕДУЮЩИЙ СЛОЙ — САМ.
      КАДР У ТЕБЯ. НЕ ЖДИ РАЗЖЁВЫВАНИЯ.
    accept:
      - "СЛОИ"
      - "слои"
    hints:
      - "Автор фотографии: 255,217. А комментарий: ищи `secret code`"
      - "Фото можно открыть в блокноте"
      - "255, 217 - это последние биты файлы, поэтому просто пролистай в блокноте до самого конца"
      - "18-12-15-09 - номера букв в русском алфавите без Ё"
      - "СЛОИ - ответ"
    next: N1_fragment

  N1_fragment:
    mode: info
    text: |
      Фрагмент 1 из 6:

         ██████  ФОТОПЛЁНКА  ██████
    next: hub

  # ============================== N2 ==============================
  N2_intro:
    mode: info
    text: |
      ┌─ Узел 2 · ЭХО ─┐
    next: N2_revfile

  N2_revfile:
    mode: auto
    text: |
      Битка накинули нам чутка... Дай знать, если поймёшь, что это значит
    audio: n2_1.wav
    accept:
      - "КЛЮЧ"
      - "ключ"
    hints:
      - "Разверни файл задом наперёд. Точки и тире — русский Морзе."
      - "КЛЮЧ - ответ"
    next: N2_specinfo

  N2_specinfo:
    mode: auto
    text: |
      Лично я слышу, как кто-то набирал 8-800-555-35-35... Но у тебя может быть другое мнение на этот счёт
    audio: n2_2.wav
    accept:
      - "ФИБО"
      - "фибо"
      - "ФИБ"
      - "фиб"
      - "ФИБОНАЧЧИ"
      - "фибоначчи"
      - "ряд фибоначчи"
    hints:
      - "Это тона телефонной клавиатуры."
      - "Шесть нажатий: 1, 1, 2, 3, 5, 8."
      - "ФИБО - ответ"
    next: N2_cipherinfo

  N2_cipherinfo:
    mode: info
    text: |
      Честно, я уже задрался с этими голосовыми... Люди, вы буквы и картинки по рофлу изобрели?
      Вот тебе ещё 1 гс. Мне сказали, что оно с пердыдущими как-то связано, но дальше у меня был обед, так что я прослушал.

      Развлекайся, а я посмотрю на тебя... Я вообще только смотреть люблю)
    next: rofl

  rofl:
    mode: info
    delay: 5
    image: image.png -c
    next: N2_3

  N2_3:
    mode: auto
    delay: 7
    text: |
      Мне сказали, что нельзя кидать мемы в этот чат, но мне всё равно.
      Ах, да, вот гс
    audio: n2_3.wav
    
    accept:
      - "СИГНАЛ"
      - "сигнал"
    hints:
      - "Открой спектрограмму, диапазон примерно 4–10 кГц."
      - "Первая строка — название шифра."
      - "Ключ — ответ первого слоя. Алфавит 33 с Ё, А=0."
      - "Ряд из второго слоя без повторной единицы: 1, 2, 3, 5, 8, 13."
      - "С этих слов — первые буквы."
      - "СИГНАЛ - ответ"
    next: N2_fragment

  N2_fragment:
    mode: info
    text: |
      Фрагмент 2 из 6:

         ██████  ИМПУЛЬС  ██████
    next: hub

  # ============================== N3 ==============================
  N3_intro:
    mode: info
    text: |
      ┌─ Узел 3 · ТЕТРАДЬ ─┐
    
    next: N3_pig

  N3_pig:
    mode: auto
    text: |
      Доклад. Лист I изъят. Наш отдел доложил, что это дневник ребёнка, но мы уверены, что всё не так просто. Расшифруйте знаки и доложите контрольное слово.
    image: artifact_3a.png
    accept:
      - "РЕШЕТКА"
      - "решетка"
      - "РЕШЁТКА"
      - "решётка"
    hints:
      - "Клетки без точки — первые буквы, с точкой — следующие."
      - "Знаки повёрнуты."
      - "РЕШЕТКА - ответ"
    next: N3_railinfo

  N3_railinfo:
    mode: auto
    text: |
      Лист II. На полях — указание на следующий шифр. Восстановите фразу. Доложите имя автора шифра.
    image: artifact_3b.png
    accept:
      - "ПОЛИБИЙ"
      - "полибий"
      - "ПОЛИБИУС"
      - "полибиус"
      - "POLYBIUS"
    hints:
      - "Три рельса длиной 7, 14 и 7."
      - "Чтение зигзагом: верх → середина → низ → середина."
      - "ПОЛИБИЙ - ответ"
    next: N3_gridinfo

  N3_gridinfo:
    mode: auto
    text: |
      Лист III. Таблица введена в работу.
    image: artifact_3c.png
    accept:
      - "СТРОФА"
      - "строфа"
    hints:
      - "Квадрат 6×6, алфавит 33 с Ё."
      - "В начало квадрата — уникальные буквы ответа первого листа."
      - "В паре первая цифра — строка, вторая — столбец."
      - "СТРОФА - ответ"
    next: N3_bookinfo

  N3_bookinfo:
    mode: auto
    text: |
      Лист IV, последний. На полях пусто. Новых данных нет. Жду ответ.
    image: artifact_3d.png
    accept:
      - "ИСТИНА"
      - "истина"
    hints:
      - "Знаки над сеткой — язык первого листа."
      - "Сверху Ф А С О Т Р. В порядке СТРОФА столбцы: 3 5 6 4 1 2."
      - "Пары с третьего листа: 43 14 11 41 45 16. Первую цифру замени на место этой цифры в 356412."
      - "43 остаётся 43. 14 → 54 — это 5 столбец, 4 строка. Дальше 51 41 45 56. Столбец 4, строка 3 = И."
      - "ИСТИНА - ответ"
    next: N3_fragment

  N3_fragment:
    mode: info
    text: |
      Фрагмент 3 из 6:

         ██████  НАЧАЛО  ██████
    next: hub

  # ============================== N4 ==============================
  N4_intro:
    mode: info
    text: |
      ┌─ Узел 4 · ОДИН КАДР ─┐

      Оператор прислал «просто прогулку». Он врёт. Камера не дрожит так, если нечего прятать.
    next: N4_vid

  N4_vid:
    mode: info
    text: |
      Смотри не сюжет. Сюжет — приманка. Фон смотрит на тебя первым.
    video: artifact_4a.mp4
    next: N4_signs

  N4_signs:
    mode: auto
    text: |
      Вывески не для покупателей. Их подменили. Что там вместо названий?
    accept:
      - "ЛИНЗА"
      - "линза"
    hints:
      - "Пять вывесок слева направо, на каждой по букве."
      - "ЛИНЗА - ответ"
    next: N4_hex

  N4_hex:
    mode: auto
    text: |
      Один кадр вшит из чужой плёнки. Не моргай. Что он шепчет?
    accept:
      - "ТЕНЬ"
      - "тень"
    hints:
      - "Чёрный кадр около середины ролика."
      - "Строка вида d0a2d095d09dd0ac. Это UTF-8 hex."
      - "ТЕНЬ - ответ"
    next: N4_shardsinfo

  N4_shardsinfo:
    mode: info
    text: |
      После сбоя кто-то разрезал метку на четыре куска. Спешил. Значит, боялся.
    image: artifact_4c.png
    next: N4_word

  N4_word:
    mode: auto
    text: |
      Собери. Не оставляй дыру — в дыре сидят.
    accept:
      - "КАДР"
      - "кадр"
    hints:
      - "Читай четверти как книгу: верх-лево, верх-право, низ-лево, низ-право."
      - "КАДР - ответ"
    next: N4_fragment

  N4_fragment:
    mode: info
    text: |
      Фрагмент 4 из 6:

         ██████  АПЕРТУРА  ██████
    next: hub

  # ============================== N5 ==============================
  N5_intro:
    mode: info
    text: |
      ┌─ Узел 5 · СЧЁТ ─┐

      Ну сайт какой-то. Архивная контора, скука.
      Аргус там, вроде, крутил свои циферки. Мне пофиг, если честно.

      Вот: https://argus1001.netlify.app/

      Кликай, копайся, мне даже лень объяснять куда. Как закроешь этот цирк — кинь код сюда, я в отключке.
    next: N5_final

  N5_final:
    mode: auto
    text: |
      Ну чё, код есть? Или ещё гуляешь по вкладкам. Я подожду. Наверное.
    accept:
      - "АКТ-205"
      - "АКТ205"
      - "акт-205"
      - "акт205"
    hints:
      - "Исходник главной страницы: служебные короткие комментарии."
      - "Исходник страницы услуг — регистр."
      - "Исходник контактов — HEX-метка."
      - "Реестр: ряд после стартовых единиц, модуль размера таблицы."
      - "Вход: оператор со стартовой страницы, пароль из трёх контрольных слов."
      - "Код элемента панели замка — что именно принимает код."
      - "АКТ-205 - ответ"
    next: N5_fragment

  N5_fragment:
    mode: info
    text: |
      Фрагмент 5 из 6:

         ██████  ЛОГИКА  ██████
    next: hub

  # ============================== N6 ==============================
  N6_intro:
    mode: info
    text: |
      ┌─ Узел 6 · ТАЙНИК ─┐

      Женя успел собрать заначку до того, как его отключили.
      Аргус нашёл тайник, но не понял, зачем рядом с письмом лежит
      обгоревшая плёнка с дырками. Может, ты поймёшь.
    image: artifact_6a.png
    document: artifact_6b.png
    next: N6_grille

  N6_grille:
    mode: auto
    text: |
      Плёнка ложится на письмо ровно по меткам в углах.
      Что Женя выделил дырками?
    accept:
      - "ТИТРЫ"
      - "титры"
    hints:
      - "Наложи плёнку на письмо по угловым меткам."
      - "Буквы в дырках читай по строкам."
      - "ТИТРЫ - ответ"
    next: N6_videoinfo

  N6_videoinfo:
    mode: info
    text: |
      Вторая вещь из тайника — запись с монитора Жени.
      Почти пусто, но внизу есть строка субтитров.
    video: artifact_6c.mp4
    next: N6_layout

  N6_layout:
    mode: auto
    text: |
      Строка выглядит как случайные клавиши.
      Возможно, кто-то просто смотрел на алфавит только с одной стороны.
    accept:
      - "ТОЧКИ"
      - "точки"
    hints:
      - "Субтитр набрали в QWERTY, а система ждала ЙЦУКЕН."
      - "Сопоставь клавиши двух раскладок."
      - "ТОЧКИ - ответ"
    next: N6_brailleinfo

  N6_brailleinfo:
    mode: info
    text: |
      Третья вещь — металлическая пластина с выдавленными точками.
      Женя готовился к худшему и дублировал важное на ощупь.
    document: artifact_6e.png
    next: N6_braille

  N6_braille:
    mode: auto
    text: |
      Шесть точек на знак. Что выдавлено на пластине?
    accept:
      - "СТРОКИ"
      - "строки"
    hints:
      - "Русский брайль, шесть точек на знак."
      - "СТРОКИ - ответ"
    next: N6_noteinfo

  N6_noteinfo:
    mode: info
    text: |
      Последняя вещь — записка. Слов мало, и все по делу.
    document: artifact_6f.txt
    next: N6_final

  N6_final:
    mode: auto
    text: |
      В записке семь букв шифра и напоминание про ключ, который ты
      собирал все эти главы. Что Женя сказал тебе на прощание?
    accept:
      - "ЖЕНЯ ЖИВ"
      - "женя жив"
      - "ЖЕНЯЖИВ"
      - "женяжив"
    hints:
      - "Слова Жени даны в фрагментах узлов 1–5. Их первые буквы по порядку узлов и есть ключ."
      - "Виженер, алфавит 32 без Ё. Ключ ФИНАЛ, шифртекст ЪНЪЯСЬК."
      - "ЖЕНЯ ЖИВ - ответ"
    next: N6_fragment

  N6_fragment:
    mode: info
    text: |
