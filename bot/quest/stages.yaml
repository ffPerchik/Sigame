# ARG «Аргус-1001» — хаб на 6 узлов: порядок 1–5 любой, N6 появляется как финал после них.
# Уличная точка: у стадии qr: true и accept: ["КОД"], затем python bot/make_qr.py
entry_code: "ARGUS1001"

# Поле `messages:` — последовательность сообщений. У каждого `delay` означает
# паузу ПЕРЕД именно этим сообщением. `speaker: argus` добавляет реальное время
# и префикс ARGVS-1001; `speaker: zhenya` включает Telegram-индикатор «печатает»
# на время задержки и отправки. Обычные сообщения используют те же задержки.

welcome:
  speaker: zhenya
  delay: 1.5
  text: |
    Привет. Это Женя.
    Если ты это читаешь, то ты добрался до квеста, молодец!!!



nodes:
  N1: {label: "СЛОИ СНИМКА", hint: "надпись · файл · хвост"}
  N2: {label: "ЭХО", hint: "реверс · ритм · спектр · многослойный сигнал"}
  N3: {label: "ТЕТРАДЬ", hint: "бумажные шифры · несколько связанных листов"}
  N4: {label: "ОДИН КАДР", hint: "видео · поиск незаметных деталей"}
  N5: {label: "СЧЁТ", hint: "числовая логика · данные внутри файла"}
  N6: {label: "ТАЙНИК", hint: "финал · цепочка шифров на четырёх носителях"}

stages:

  z_1:
    mode: auto
    messages:
      - speaker: zhenya
        delay: 1.5
        text: |
          Это мой первый опыт, я очень старался!!! Да, сначала будет просто, но мы разгонемся, обещаю!!!
          Ну что же, давай начнём

      - speaker: zhenya
        delay: 1.5
        text: |
          +1 без Ё:
          РСЙГЖУ
    accept:
      - "ПРИВЕТ"
      - "привет"
    hint: |
      Каждую букву сдвинь на одну назад. Должно получиться приветствие.
    next: a_1

  a_1:
    mode: info
    messages:
      - {speaker: argus, delay: 1, text: "NETWORK INTERFACE: ACTIVE"}
      - {speaker: argus, delay: 1, text: "ESTABLISHING SECURE HANDSHAKE…"}
      - {speaker: argus, delay: 1, text: "HANDSHAKE ACCEPTED"}
      - {speaker: argus, delay: 1, text: "VOICE CHANNEL TEST: …ТЫ СЛЫШИШЬ НАС?"}
    next: z_2

  z_2:
    mode: auto
    speaker: zhenya
    delay: 6
    text: |
      ээ-м... это не я писал... лаг какой-то... Да ладно, неважно

      Уже что-то поинтереснее: 17-6-18-25-10-12
    accept:
      - "перчик"
      - "ПЕРЧИК"
    hint: |
      Числа — номера букв в алфавите без Ё.
    next: a_2

  a_2:
    mode: info
    messages:
      - {speaker: argus, delay: 1.5, text: "HANDSHAKE PROGRESS: 25%"}
      - {speaker: argus, delay: 1.5, text: "TARGET GATEWAY DETECTED"}
      - {speaker: argus, delay: 1.5, text: "AUTHORIZATION STATUS: UNKNOWN"}
      - {speaker: argus, delay: 1.5, text: "ENCRYPTED CHANNEL: ONLINE"}
    next: z_3

  z_3:
    mode: info
    speaker: zhenya
    delay: 4
    text: |
      Чё, какой 25? 25% чего? Какой к чёрту канал? Ты тоже видишь эти сообщения?
      Я сейчас перезапущу бота. Подожди немного, а пока вот ещё одна задачка, пока перезапускается.
    next: picture_1
    
  picture_1:
    mode: info
    document: z_3.png -c
    next: a_3

  a_3:
    mode: info
    messages:
      - {speaker: argus, delay: 1, text: "CHANNEL INJECTION: 50%"}
      - {speaker: argus, delay: 1, text: "WARNING: UNUSUAL ACTIVITY DETECTED"}
      - {speaker: argus, delay: 1, text: "HOST PROCESS «kolysheev» IS ATTEMPTING RESTART"}
      - {speaker: argus, delay: 1, text: "RESTART EMITATION: STARTED"}
    next: bot_1

  bot_1:
    mode: auto
    delay: 4
    text: |
      🤖 Бот @Zengame_checker_bot запущен. HOST=k@ly$%ev. Жду команд.
    accept:
      - "zengame"
      - "ZENGAME"
      - "zen game"
    hint: |
      Текст спрятан на картинке выше. Просто прочитай.
    next: z_4

  z_4:
    mode: auto
    speaker: zhenya
    delay: 1.5
    text: |
      Я откатываю апдейт, даже не смей писать, что это какой-то «взлом». Просто баг. Просто баг, Женя... Просто баг...
    accept:
      - "взлом"
      - "взлом"
    hint: |
      Просто напиши «взлом»
    next: z_a_final

  z_a_final:
    mode: info
    messages:
      - {speaker: argus, delay: 1.5, text: "CHANNEL OVERWRITE: 75%"}
      - {speaker: argus, delay: 1.5, text: "CONNECTION STABILIZED"}
      - {speaker: argus, delay: 1.5, text: "CHANNEL OVERWRITE: 100%"}
      - {speaker: argus, delay: 1.5, text: "ПЕРЕДАЧА ПЕРЕХВАЧЕНА"}
      - {speaker: argus, delay: 1.5, text: "ИГРОК, НЕ ЗАКРЫВАЙ СОЕДИНЕНИЕ. ОСТАЛСЯ ОДИН ШАГ."}
      - {speaker: zhenya, delay: 3.5, text: "нет нет нет подож——"}
      - {speaker: argus, delay: 0, text: "TERMINATING HOST SESSION…"}
      - {speaker: argus, delay: 1.5, text: "CONNECTION OWNER: ARGVS-1001"}
      - {speaker: argus, delay: 1.5, text: "ЖЕНИ БОЛЬШЕ НЕТ"}
    next: z_hack

  z_hack:
    mode: info
    messages:

      - delay: 10
        text: |
          ┌────────────────────────────────────────────────────────────────┐
          │  ARGVS-1001 · СЕАНС ПЕРЕХВАЧЕН                                 │
          └────────────────────────────────────────────────────────────────┘
    next: quest_gate

  quest_gate:
    mode: auto
    accept_entry_code: true
    correct_text: ""
    wrong_argus: "Ключ отклонён, ты недостоен, но мы дадим тебе ещё 1 шанс, так и быть. "
    messages:
      - {speaker: argus, delay: 1, text: "Что же, теперь сеанс наш, можно расслабиться"}
      - {speaker: argus, delay: 1, text: "Для начала мы хотим проверить, что ты не безнадёжен"}
      - {speaker: argus, delay: 1, text: "Введи ключ, докажи нам, что с тобой можно работать. Мы запрятали его там, где ты был недавно."}
      - {speaker: zhenya, text: "PS: если вы играете первый раз, то напишите ведущему, это задание требует доп файлов"}
    hints:
      - "Ключ внутри zengame.siq — это контейнер, не викторина."
      - "Финал пакета. Стеганография картинки, потом START.txt."
    next: quest_unlocked

  quest_unlocked:
    mode: gate
    messages:
      - {speaker: argus, delay: 0.5, text: "ACTIVATION KEY ACCEPTED"}
      - {speaker: argus, delay: 0.5, text: "ДОСТУП К ШЕСТИ УЗЛАМ РАЗРЕШЁН"}
      - {speaker: argus, delay: 3, text: "Мы свяжемся с тобой, когда придёт время"}
    next: helper

  helper:
    mode: info
    text: |
      ℹ️ℹ️ℹ️ℹ️ℹ️INFOℹ️ℹ️ℹ️ℹ️ℹ️
      На связи helper. Я тут только чтобы рассказать вам правила, по которым тут всё работает.

      Следующее сообщение представляет из себя HUB. Это слой, который позволяет вам отслеживать ваш прогресс.
      Также, у вас есть возможность выбрать порядок, в котором вы будите решать загадки. При этом, после выбора слоя, у вас НЕ БУДЕТ возможности перейти на другой узел до завершения этого.
      Поэтому с умом читайте микроописание каждого слоя, чтобы идти в наилучшем для вас порядке.

      У вас есть подсказки (/hint). Они не бесконечны, но могут быть заработаны. Я не скажу вам за какие действия это происходит, быть может если написать "sixseven", то дадут подсказку, кто знает... А может их вообще нет...)

      Если вы потерялись, забыли, сколько у вас подсказок, ну или вас ударила амнезия и вы забыли вопрос, который прочитали 3 секунды назад... - команда /progress решит все ваши проблемы

      P.S. Возможно, если окончить игру с числом подсказок > 0, то что-то будет)


    next: hub


  # ============================== N1 ==============================
  N1_intro:
    mode: info
    text: |
      ┌─ Узел 1 · СЛОИ СНИМКА ─┐
    next: N1_photo

  N1_photo:
    mode: info
    text: |
      Мы перехватили этот кадр. Для начала проверим, что кадр дошёл до тебя.
    document: n1_card.jpg
    next: N1_flip

  N1_flip:
    mode: auto
    text: |
      Я заметил на фото фразу, а ты?
    accept:
      - "СМОТРИ ВНУТРЬ"
      - "смотри внутрь"
    hint: |
      Надпись на экране монитора, зелёным. Буквы идут задом наперёд.
      Должно получиться повелительное наклонение и наречие.
    next: N1_exif

  N1_exif:
    mode: auto
    text: |
      Отлично, ты не безнадёжен, но дальше ты сам. Картинка у тебя есть, веселись.
    accept:
      - "СЛОИ"
      - "слои"
    hints:
      - "Автор фотографии: 255,217. А комментарий: ищи `secret code`"
      - "Файл можно открыть как текст, не только как картинку. Смотри самый конец."
      - "То, что после метки конца — номера букв. Алфавит без Ё."
    next: N1_fragment

  N1_fragment:
    mode: info
    text: |
      Фрагмент 1 из 6:

         ██████  ОТКРОЙ  ██████
    next: hub

  # ============================== N2 ==============================
  N2_intro:
    mode: info
    text: |
      ┌─ Узел 2 · ЭХО ─┐
    next: N2_revfile

  N2_revfile:
    mode: auto
    text: |
      Битка накинули нам чутка... Дай знать, если поймёшь, что это значит
    audio: n2_1.wav
    accept:
      - "КЛЮЧ"
      - "ключ"
    hint: |
      Разверни файл. Точки и тире — русский Морзе. Одно существительное.
    next: N2_specinfo

  N2_specinfo:
    mode: auto
    text: |
      Лично я слышу, как кто-то набирал 8-800-555-35-35... Но у тебя может быть другое мнение на этот счёт
    audio: n2_2.wav
    accept:
      - "ФИБО"
      - "фибо"
      - "ФИБ"
      - "фиб"
      - "ФИБОНАЧЧИ"
      - "фибоначчи"
      - "ряд фибоначчи"
    hint: |
      Тона телефонной клавиатуры. Шесть нажатий — начало известного ряда.
      Назови ряд сокращённо.
    next: N2_cipherinfo

  N2_cipherinfo:
    mode: auto
    text: |
      Честно, я уже задрался с этими голосовыми... Но вот тебе ещё 1. Главбосс мне сказал, что оно с пердыдущими как-то связано, развлекайся
    audio: n2_3.wav

    accept:
      - "СИГНАЛ"
      - "сигнал"
    hints:
      - "Смотри диапазон примерно 4–10 кГц: музыка остаётся ниже."
      - "Первая строка — название шифра. Ключ — ответ первого слоя.
        Алфавит 33 с Ё, А=0."
      - "Ряд из второго слоя, без повторной единицы. С позиции — первая буква слова."
    next: N2_fragment

  N2_fragment:
    mode: info
    text: |
      Фрагмент 2 из 6:

         ██████  УСЛЫШЬ  ██████
    next: hub

  # ============================== N3 ==============================
  N3_intro:
    mode: info
    text: |
      ┌─ Узел 3 · ТЕТРАДЬ ─┐
    
    next: N3_pig

  N3_pig:
    mode: auto
    text: |
      Здравствуйте, задача: расшифровать надписи в этих манускриптах. 
      По всей видимости, это древние записи какого-то ребёнка, но наш отдел уверен, что это больше, чем просто дневник.
    image: artifact_3a.png
    accept:
      - "РЕШЕТКА"
      - "решетка"
      - "РЕШЁТКА"
      - "решётка"
    hint: |
      Клетки без точки / с точкой. Знаки повёрнуты. Семь знаков — одно существительное.
    next: N3_railinfo

  N3_railinfo:
    mode: auto
    text: |
      Лист II. Судя по фразам на полях: здесь спрятан шифр к следующему листу.
    image: artifact_3b.png
    accept:
      - "ПОЛИБИЙ"
      - "полибий"
      - "ПОЛИБИУС"
      - "полибиус"
      - "POLYBIUS"
    hint: |
      Три рельса, чтение зигзагом. Последнее слово — имя шифра.
    next: N3_gridinfo

  N3_gridinfo:
    mode: auto
    text: |
      Лист III.
    image: artifact_3c.png
    accept:
      - "СТРОФА"
      - "строфа"
    hint: |
      Квадрат 6×6, алфавит 33 с Ё. Сначала уникальные буквы ответа первого листа,
      затем остальные. В паре первая цифра — строка, вторая — столбец.
    next: N3_bookinfo

  N3_bookinfo:
    mode: auto
    text: |
      Последний лист. Новых координат на нём нет: три найденных слова становятся одной инструкцией.
    image: artifact_3d.png
    accept:
      - "ИСТИНА"
      - "истина"
    hint: |
      Три найденных слова — инструкция. Пары бери с прошлого листа.
      Из клетки — первая буква.
    next: N3_fragment

  N3_fragment:
    mode: info
    text: |
      Фрагмент 3 из 6:

         ██████  ПРОЧИТАЙ  ██████
    next: hub

  # ============================== N4 ==============================
  N4_intro:
    mode: info
    text: |
      ┌─ Узел 4 · ОДИН КАДР ─┐

      Оператор прислал короткую прогулку и уверяет, что ничего странного не снимал.
    next: N4_vid

  N4_vid:
    mode: info
    text: |
      Запись слишком аккуратная. Возможно, фон здесь говорит громче сюжета.
    video: artifact_4a.mp4
    next: N4_signs

  N4_signs:
    mode: auto
    text: |
      Что оставили там, где обычно ждёшь только названия?
    accept:
      - "ЛИНЗА"
      - "линза"
    hint: |
      Пять вывесок слева направо, на каждой по букве.
    next: N4_hex

  N4_hex:
    mode: auto
    text: |
      Один миг явно попал сюда из другой записи. Что он пытается сказать?
    accept:
      - "ТЕНЬ"
      - "тень"
    hint: |
      Чёрный кадр около середины. Байты кадра — UTF-8 в hex.
    next: N4_shardsinfo

  N4_shardsinfo:
    mode: info
    text: |
      После сбоя сохранились четыре части одной метки.
    image: artifact_4c.png
    next: N4_word

  N4_word:
    mode: auto
    text: |
      Что удалось восстановить?
    accept:
      - "КАДР"
      - "кадр"
    hint: |
      Читай четверти как книгу: верх-лево, верх-право, низ-лево, низ-право.
    next: N4_fragment

  N4_fragment:
    mode: info
    text: |
      Фрагмент 4 из 6:

         ██████  НАБЛЮДАЙ  ██████
    next: hub

  # ============================== N5 ==============================
  N5_intro:
    mode: info
    text: |
      ┌─ Узел 5 · СЧЁТ ─┐

      Мы нашли обычную витрину архивной компании. Снаружи она ничем не отличается
      от сотен таких же сайтов, но Аргус использовал её как расчётный узел.

      Открой сайт: https://argus1001.netlify.app/

      Здесь важны не красивые блоки страницы, а служебные следы.
      Когда расчёт будет закрыт на сайте, пришли сюда итоговый код.
    next: N5_final

  N5_final:
    mode: auto
    text: |
      Жду финальный код закрытия расчётного узла.
    accept:
      - "АКТ-205"
      - "АКТ205"
      - "акт-205"
      - "акт205"
    hints:
      - "На видимой странице почти нет задачи. Начни с исходника главной страницы: там есть служебные короткие комментарии."
      - "Пройди публичные страницы сайта и смотри их исходник. Регистр лежит в услугах, HEX-метка — в контактах."
      - "Матрица в реестре читается не подряд. Ряд после стартовых единиц, по модулю размера таблицы."
      - "Для входа в панель нужны оператор со стартовой страницы и пароль из трёх контрольных слов: регистр, реестр, источник."
      - "В админке слова уже стоят на местах. Посмотри код элемента панели замка: там спрятано, что именно принимает код."
    next: N5_fragment

  N5_fragment:
    mode: info
    text: |
      Фрагмент 5 из 6:

         ██████  ВЫЧИСЛИ  ██████
    next: hub

  # ============================== N6 ==============================
  N6_intro:
    mode: info
    text: |
      ┌─ Узел 6 · ТАЙНИК ─┐

      Женя успел собрать заначку до того, как его отключили.
      Аргус нашёл тайник, но не понял, зачем рядом с письмом лежит
      обгоревшая плёнка с дырками. Может, ты поймёшь.
    image: artifact_6a.png
    document: artifact_6b.png
    next: N6_grille

  N6_grille:
    mode: auto
    text: |
      Плёнка ложится на письмо ровно по меткам в углах.
      Что Женя выделил дырками?
    accept:
      - "ТИТРЫ"
      - "титры"
    hint: |
      Наложи плёнку на письмо по угловым меткам. Буквы в дырках читай по строкам.
      Слово из пяти букв подскажет, куда смотреть дальше.
    next: N6_videoinfo

  N6_videoinfo:
    mode: info
    text: |
      Вторая вещь из тайника — запись с монитора Жени.
      Почти пусто, но внизу есть строка субтитров.
    video: artifact_6c.mp4
    next: N6_layout

  N6_layout:
    mode: auto
    text: |
      Строка выглядит как случайные клавиши.
      Возможно, кто-то просто смотрел на алфавит только с одной стороны.
    accept:
      - "ТОЧКИ"
      - "точки"
    hints:
      - "Субтитр набрали на физической клавиатуре QWERTY, а система ждала ЙЦУКЕН. Сопоставь клавиши."
      - "Одна клавиша — другая раскладка. Пять букв, одно существительное."
    next: N6_brailleinfo

  N6_brailleinfo:
    mode: info
    text: |
      Третья вещь — металлическая пластина с выдавленными точками.
      Женя готовился к худшему и дублировал важное на ощупь.
    document: artifact_6e.png
    next: N6_braille

  N6_braille:
    mode: auto
    text: |
      Шесть точек на знак. Что выдавлено на пластине?
    accept:
      - "СТРОКИ"
      - "строки"
    hint: |
      Русский брайль, шесть точек на знак. Одно существительное.
    next: N6_noteinfo

  N6_noteinfo:
    mode: info
    text: |
      Последняя вещь — записка. На первый взгляд просто извинение.
    document: artifact_6f.txt
    next: N6_acrostic

  N6_acrostic:
    mode: auto
