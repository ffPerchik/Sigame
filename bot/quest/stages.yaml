# =============================================================================
#  Квест «Чистый Cicada». Идёт ДО «Своей игры»: за каждый пройденный этап бот
#  начисляет игроку +1 «подсказку» для грядущей Игры (преимущество в «Своей игре»).
#
#  mode: info / auto / approve / finish   (см. README.md)
#  qr: true — локация с QR; accept[0] — код в QR (deep link t.me/<bot>?start=CODE)
#  accept: принимаемые ответы (регистр/ё/пунктуация не важны)
#  Шифры — русский алфавит БЕЗ Ё (32 буквы): АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ
# =============================================================================

entry_code: "ZENGAME2026"
start: intro

stages:
  intro:
    mode: info
    text: |
      ▓▓▓ СЛЕДЯЩИЕ ▓▓▓
      Мы наблюдали за тем, как ты смотришь. Большинство видит только поверхность.
      Ты — нет.

      Это испытание индивидуально. Каждый — сам за себя.
      За каждый пройденный слой ты получаешь +1 подсказку, которую сможешь
      использовать в грядущей Игре. Чем дальше пройдёшь — тем больше преимущество.

      Начинай. Первый слой прост.
    next: caesar

  caesar:
    mode: auto
    text: |
      Слой 1. Шифр Цезаря, сдвиг +3 (сдвинь каждую букву НАЗАД на 3):
      «ЛЖУГ»
    accept: ["игра"]
    hint: "Алфавит без Ё: А=1…Я=32. Л→И (сдвиг -3). Примени ко всем буквам."
    next: a1z26

  a1z26:
    mode: auto
    text: |
      Слой 2. Каждая буква — её номер (А=1, Б=2, …, Я=32). Расшифруй:
      «11-15-5»
    accept: ["код"]
    hint: "К=11, О=15, Д=5."
    next: reverse

  reverse:
    mode: auto
    text: |
      Слой 3. Прочитай наоборот:
      «ЧЮЛК»
    accept: ["ключ"]
    hint: "Запиши слово задом наперёд."
    next: gate1

  gate1:
    mode: auto
    qr: true
    text: |
      Слой 4. Выйди в мир. Локация №1.
      [ВЕДУЩИЙ: укажи игроку место — например, лавка у дома / конкретный объект.
       Там спрятан QR. Распечатай qr/gate1.png и положи.]
      Найди QR и отсканируй — откроется ссылка на меня, слой засчитается.
      Нет сканера? Введи код с QR вручную.
    accept: ["GATE1"]
    hint: "QR спрятан там, где сказал ведущий. Ищи внимательно."
    next: proof1

  proof1:
    mode: approve
    text: |
      Слой 5. Докажи, что был на месте. Пришли фото (ты на локации ИЛИ
      найденный предмет). Ведущий проверит.
    next: vigenere

  vigenere:
    mode: auto
    text: |
      Слой 6. Шифр Виженера, ключ-слово «ИГРА». Расшифруй:
      «ЩИЪРНХ»
    accept: ["секрет"]
    hint: "Ключ ИГРА повторяется: для каждой буквы шифра вычти номер буквы ключа."
    next: acrostic

  acrostic:
    mode: auto
    text: |
      Слой 7. Возьми ПЕРВЫЕ буквы каждого слова:
      «Сова Искала Гнездо Ночью, А Луна светила ярко»
    accept: ["сигнал"]
    hint: "С… И… Г… Н… А… Л…"
    next: binary

  binary:
    mode: auto
    text: |
      Слой 8. Двоичный код (ASCII, латиница). Расшифруй слово:
      01000110 01001001 01001110 01000001 01001100
    accept: ["final"]
    hint: "Каждые 8 бит = один символ (англ.). 01000110 = 'F'."
    next: gate2

  gate2:
    mode: auto
    qr: true
    text: |
      Слой 9. Локация №2.
      [ВЕДУЩИЙ: укажи второе место. Распечатай qr/gate2.png и спрячь.]
      Найди второй QR и отсканируй (или введи код).
    accept: ["GATE2"]
    hint: "Вторая точка от ведущего."
    next: final

  final:
    mode: auto
    text: |
      Последний слой. Шифр Цезаря, сдвиг +5 (сдвинь НАЗАД на 5):
      «ЩНТЕР»
    accept: ["финал"]
    hint: "Ф… — это конец пути. Щ-5=Ф."
    next: finish

  finish:
    mode: finish
    text: |
      ▓▓▓ ДОСТУП ПОЛУЧЕН ▓▓▓
      Ты прошёл все слои. Мы запомнили.
      Твои накопленные подсказки ждут тебя в грядущей Игре.
