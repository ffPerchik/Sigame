# ARG «Аргус-1001» — хаб, 6 независимых узлов.
# Уличная точка: у стадии qr: true и accept: ["КОД"], затем python bot/make_qr.py
entry_code: "ARGUS1001"

# Поле `messages:` — последовательность сообщений. У каждого `delay` означает
# паузу ПЕРЕД именно этим сообщением. `speaker: argus` добавляет реальное время
# и префикс ARGVS-1001; `speaker: zhenya` включает Telegram-индикатор «печатает»
# на время задержки и отправки. Обычные сообщения используют те же задержки.

welcome:
  speaker: zhenya
  delay: 1.5
  text: |
    Привет. Это Женя.
    Если ты это читаешь, то ты добрался до квеста, молодец!!!



nodes:
  N1: {label: "СЛОИ СНИМКА", hint: "надпись · файл · хвост"}
  N2: {label: "ЭХО", hint: "реверс · ритм · спектр · многослойный сигнал"}
  N3: {label: "ТЕТРАДЬ", hint: "бумажные шифры · несколько связанных листов"}
  N4: {label: "ОДИН КАДР", hint: "видео · поиск незаметных деталей"}
  N5: {label: "СЧЁТ", hint: "числовая логика · данные внутри файла"}
  N6: {label: "ЧЕТЫРЕ ЩЕКОЛДЫ", hint: "цепочка шифров · один ответ ведёт к другому"}

stages:

  z_1:
    mode: auto
    messages:
      - speaker: zhenya
        delay: 1.5
        text: |
          Это мой первый опыт, я очень старался!!! Да, сначала будет просто, но мы разгонемся, обещаю!!!
          Ну что же, давай начнём

      - speaker: zhenya
        delay: 1.5
        text: |
          +1 без Ё:
          РСЙГЖУ
    accept:
      - "ПРИВЕТ"
      - "привет"
    hint: |
      Каждую букву сдвинь на одну назад. Р→П, С→Р, Й→И, Г→В, Ж→Е, У→Т.
    next: a_1

  a_1:
    mode: info
    messages:
      - {speaker: argus, delay: 1, text: "NETWORK INTERFACE: ACTIVE"}
      - {speaker: argus, delay: 1, text: "ESTABLISHING SECURE HANDSHAKE…"}
      - {speaker: argus, delay: 1, text: "HANDSHAKE ACCEPTED"}
      - {speaker: argus, delay: 1, text: "VOICE CHANNEL TEST: …ТЫ СЛЫШИШЬ НАС?"}
    next: z_2

  z_2:
    mode: auto
    speaker: zhenya
    delay: 6
    text: |
      ээ-м... это не я писал... лаг какой-то... Да ладно, неважно

      Уже что-то поинтереснее: 17-6-18-25-10-12
    accept:
      - "перчик"
      - "ПЕРЧИК"
    hint: |
      числа в буквы, номер в алфавите
    next: a_2

  a_2:
    mode: info
    messages:
      - {speaker: argus, delay: 1.5, text: "HANDSHAKE PROGRESS: 25%"}
      - {speaker: argus, delay: 1.5, text: "TARGET GATEWAY DETECTED"}
      - {speaker: argus, delay: 1.5, text: "AUTHORIZATION STATUS: UNKNOWN"}
      - {speaker: argus, delay: 1.5, text: "ENCRYPTED CHANNEL: ONLINE"}
    next: z_3

  z_3:
    mode: info
    speaker: zhenya
    delay: 4
    text: |
      Чё, какой 25? 25% чего? Какой к чёрту канал? Ты тоже видишь эти сообщения?
      Я сейчас перезапущу бота. Подожди немного, а пока вот ещё одна задачка, пока перезапускается.
    next: picture_1
    
  picture_1:
    mode: info
    document: z_3.png -c
    hint: |
      Да, надо просто прочитать, что скрыто на картинке.
    next: a_3

  a_3:
    mode: info
    messages:
      - {speaker: argus, delay: 1, text: "CHANNEL INJECTION: 50%"}
      - {speaker: argus, delay: 1, text: "WARNING: UNUSUAL ACTIVITY DETECTED"}
      - {speaker: argus, delay: 1, text: "HOST PROCESS «kolysheev» IS ATTEMPTING RESTART"}
      - {speaker: argus, delay: 1, text: "RESTART EMITATION: STARTED"}
    next: bot_1

  bot_1:
    mode: auto
    delay: 4
    text: |
      🤖 Бот @Zengame_checker_bot запущен. HOST=k@ly$%ev. Жду команд.
    accept:
      - "zengame"
      - "ZENGAME"
    hint: |
      Да, надо просто прочитать, что скрыто на картинке.
    next: z_4

  z_4:
    mode: auto
    speaker: zhenya
    delay: 1.5
    text: |
      Я откатываю апдейт, даже не смей писать, что это какой-то «взлом». Просто баг. Просто баг, Женя... Просто баг...
    accept:
      - "взлом"
      - "взлом"
    hint: |
      Просто напиши «взлом»
    next: z_a_final

  z_a_final:
    mode: info
    messages:
      - {speaker: argus, delay: 1.5, text: "CHANNEL OVERWRITE: 75%"}
      - {speaker: argus, delay: 1.5, text: "CONNECTION STABILIZED"}
      - {speaker: argus, delay: 1.5, text: "CHANNEL OVERWRITE: 100%"}
      - {speaker: argus, delay: 1.5, text: "ПЕРЕДАЧА ПЕРЕХВАЧЕНА"}
      - {speaker: argus, delay: 1.5, text: "ИГРОК, НЕ ЗАКРЫВАЙ СОЕДИНЕНИЕ. ОСТАЛСЯ ОДИН ШАГ."}
      - {speaker: zhenya, delay: 3.5, text: "нет нет нет подож——"}
      - {speaker: argus, delay: 0, text: "TERMINATING HOST SESSION…"}
      - {speaker: argus, delay: 1.5, text: "CONNECTION OWNER: ARGVS-1001"}
      - {speaker: argus, delay: 1.5, text: "ЖЕНИ БОЛЬШЕ НЕТ"}
    next: z_hack

  z_hack:
    mode: info
    messages:

      - delay: 10
        text: |
          ┌────────────────────────────────────────────────────────────────┐
          │  ARGVS-1001 · СЕАНС ПЕРЕХВАЧЕН                                 │
          └────────────────────────────────────────────────────────────────┘
    next: quest_gate

  quest_gate:
    mode: auto
    accept_entry_code: true
    correct_text: ""
    wrong_argus: "Ключ отклонён, ты недостоен, но мы дадим тебе ещё 1 шанс, так и быть. (Если ты не играл в sigame, напиши Жене, что ты дошёл до этого этапа)"
    messages:
      - {speaker: argus, delay: 1, text: "Что же, теперь сеанс наш, можно расслабиться"}
      - {speaker: argus, delay: 1, text: "Для начала мы хотим проверить, что ты не безнадёжен"}
      - {speaker: argus, delay: 1, text: "Введи ключ, докажи нам, что с тобой можно работать. Мы запрятали его там, где ты был недавно."}
    hint: |
      Ключ спрятан внутри zengame.siq.
    next: quest_unlocked

  quest_unlocked:
    mode: gate
    messages:
      - {speaker: argus, delay: 0.5, text: "ACTIVATION KEY ACCEPTED"}
      - {speaker: argus, delay: 0.5, text: "ДОСТУП К ШЕСТИ УЗЛАМ РАЗРЕШЁН"}
      - {speaker: argus, delay: 3, text: "Мы свяжемся с тобой, когда придёт время"}
    next: helper

  helper:
    mode: info
    text: |
      ℹ️ℹ️ℹ️ℹ️ℹ️INFOℹ️ℹ️ℹ️ℹ️ℹ️
      На связи helper. Я тут только чтобы рассказать вам правила, по которым тут всё работает.

      Следующее сообщение представляет из себя HUB. Это слой, который позволяет вам отслеживать ваш прогресс.
      Также, у вас есть возможность выбрать порядок, в котором вы будите решать загадки. При этом, после выбора слоя, у вас НЕ БУДЕТ возможности перейти на другой слой до завершения этого.
      Поэтому с умом читайте микроописание каждого слоя, чтобы идти в наилучшем для вас порядке.

      У вас есть подсказки (/hint). Они не бесконечны, но могут быть заработаны. Я не скажу вам за какие действия это происходит, быть может если написать "sixseven", то дадут подсказку, кто знает... А может их вообще нет...)

      Если вы потерялись, забыли, сколько у вас подсказок, ну или вас ударила амнезия и вы забыли вопрос, который прочитали 3 секунды назад... - команда /progress решит все ваши проблемы

      P.S. Возможно, если окончить игру с числом подсказок > 0, то что-то будет)


    next: hub


  # ============================== N1 ==============================
  N1_intro:
    mode: info
    text: |
      ┌─ Узел 1 · СЛОИ СНИМКА ─┐
    next: N1_photo

  N1_photo:
    mode: info
    text: |
      Мы перехватили этот кадр. Для начала проверим, что кадр дошёл до тебя.
    document: n1_card.jpg
    next: N1_flip

  N1_flip:
    mode: auto
    text: |
      Есть ли ты что-то интересное, может какая-то фраза?
    accept:
      - "СМОТРИ ВНУТРЬ"
      - "смотри внутрь"
    hint: |
      Надпись на экране монитора, зелёным. Буквы идут задом наперёд.
      Должно получиться повелительное наклонение и наречие.
    next: N1_exif

  N1_exif:
    mode: auto
    text: |
      Отлично, ты не безнадёжен, но дальше ты сам. Картинка у тебя есть, веселись.
      Подскажу в конце: внутрь — это не про пиксели.
    accept:
      - "СЛОИ"
      - "слои"
    hint: |
      Автор: 255,217. А комментарий: ищи `secret code`
    next: N1_fragment

  N1_fragment:
    mode: info
    text: |
      Фрагмент 1 из 6:

         ██████  ОТКРОЙ  ██████
    next: hub

  # ============================== N2 ==============================
  N2_intro:
    mode: info
    text: |
      ┌─ Узел 2 · ЭХО ─┐
    next: N2_revfile

  N2_revfile:
    mode: auto
    text: |
      Битка накинули нам чутка... Дай знать, если поймёшь, что это значит
    audio: n2_1.wav
    accept:
      - "КЛЮЧ"
      - "ключ"
    hint: |
      Разверни файл задом наперёд. После этого русский Морзе:
      К=-.-  Л=.-..  Ю=..--  Ч=---.
    next: N2_specinfo

  N2_specinfo:
    mode: auto
    text: |
      Лично я слышу, как кто-то набирал 8-800-555-35-35... Но у тебя может быть другое мнение на этот счёт
    audio: n2_2.wav
    accept:
      - "ФИБО"
      - "фибо"
      - "ФИБ"
      - "фиб"
      - "ФИБОНАЧЧИ"
      - "фибоначчи"
      - "ряд фибоначчи"
    hint: |
      Это DTMF — двухчастотные сигналы телефонной клавиатуры.
      Декодируй шесть нажатий: 1, 1, 2, 3, 5, 8. Назови ряд сокращённо.
    next: N2_cipherinfo

  N2_cipherinfo:
    mode: auto
    text: |
      Честно, я уже задрался с этими голосовыми... Но вот тебе ещё 1. Главбосс мне сказал, что оно с пердыдущими как-то связано
    audio: n2_3.wav

    accept:
      - "СИГНАЛ"
      - "сигнал"
    hint: |
      Смотри диапазон примерно 4–10 кГц: музыка остаётся ниже.
      Первая строка спектрограммы — ВИЖЕНЕР. Ключ — ответ первого слоя.
      Алфавит: АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ (33 буквы, А=0).
      Пробелы пропускай, но ключ после них не начинай заново.
      Позиции Фибоначчи без повторной единицы: 1, 2, 3, 5, 8, 13.
      Нужны первые буквы слов на этих позициях.
    next: N2_fragment

  N2_fragment:
    mode: info
    text: |
      Фрагмент 2 из 6:

         ██████  УСЛЫШЬ  ██████
    next: hub

  # ============================== N3 ==============================
  N3_intro:
    mode: info
    text: |
      ┌─ Узел 3 · ТЕТРАДЬ ─┐

      Четыре листа. Почерк каждый раз другой, будто автор
      всякий раз забывал, как писал до этого.
    image: artifact_3a.png
    next: N3_pig

  N3_pig:
    mode: auto
    text: |
      На первом листе спрятано слово. Какое?
    accept:
      - "РЕШЕТКА"
      - "решетка"
      - "РЕШЁТКА"
      - "решётка"
    hint: |
      Клетки без точки — первые 9 букв (А…И), с точкой — следующие.
      «Х»-семейство — дальше по алфавиту. Образец АБВ нарисован внизу.
    next: N3_railinfo

  N3_railinfo:
    mode: info
    text: |
      Лист II. Знакомые буквы прошли по бумаге каким-то ломаным путём.
    image: artifact_3b.png
    next: N3_rail

  N3_rail:
    mode: auto
    text: |
      Похоже, автор оставил название следующего шага. Что получилось?
    accept:
      - "ВИЖНЕР"
      - "вижнер"
      - "ВИЖЕНЕР"
      - "VIGENERE"
      - "виженер"
    hint: |
      6 букв, 3 рельса. Пиши зигзагом вниз-вверх, читай по строкам — наоборот:
      разложи шифр по длинам рельсов и собери зигзагом.
      Должно получиться имя шифра (русская транслитерация).
    next: N3_viginfo

  N3_viginfo:
    mode: info
    text: |
      Лист III. На полях короткая пометка: «первое слово всё ещё с тобой».
    image: artifact_3c.png
    next: N3_vig

  N3_vig:
    mode: auto
    text: |
      Что скрыто в этой строке?
    accept:
      - "СТРОФА"
      - "строфа"
    hint: |
      Виженер, алфавит 32 без Ё. Ключ РЕШЕТКА.
      Шифр: БЧИУЖК. На каждом шаге вычитай букву ключа.
    next: N3_bookinfo

  N3_bookinfo:
    mode: info
    text: |
      Последний лист. Внизу шесть пар чисел; выше ровно шесть строк.
    image: artifact_3d.png
    next: N3_book

  N3_book:
    mode: auto
    text: |
      Какое слово связало их вместе?
    accept:
      - "ИСТИНА"
      - "истина"
    hint: |
      1.2 иней, 2.3 свет, 3.3 тишина, 4.2 иней, 5.3 ночи, 6.2 архив.
    next: N3_fragment

  N3_fragment:
    mode: info
    text: |
      Фрагмент 3 из 6:

         ██████  ПРОЧИТАЙ  ██████
    next: hub

  # ============================== N4 ==============================
  N4_intro:
    mode: info
    text: |
      ┌─ Узел 4 · ОДИН КАДР ─┐

      Оператор прислал короткую прогулку и уверяет, что ничего странного не снимал.
    next: N4_vid

  N4_vid:
    mode: info
    text: |
      Запись слишком аккуратная. Возможно, фон здесь говорит громче сюжета.
    video: artifact_4a.mp4
    next: N4_signs

  N4_signs:
    mode: auto
    text: |
      Что оставили там, где обычно ждёшь только названия?
    accept:
      - "ЛИНЗА"
      - "линза"
    hint: |
      Пять витрин, на каждой по букве. Если видео не открылось —
      кадр artifact_4b.png лежит в ассетах.
    next: N4_hex

  N4_hex:
    mode: auto
    text: |
      Один миг явно попал сюда из другой записи. Что он пытается сказать?
    accept:
      - "ТЕНЬ"
      - "тень"
    hint: |
      Строка вида d0a2d095d09dd0ac. Декодируй как UTF-8 hex.
      Кадр один, около середины ролика.
    next: N4_shardsinfo

  N4_shardsinfo:
    mode: info
    text: |
      После сбоя сохранились четыре части одной метки.
    image: artifact_4c.png
    next: N4_word

  N4_word:
    mode: auto
    text: |
      Что удалось восстановить?
    accept:
      - "КАДР"
      - "кадр"
    hint: |
      Читай четверти как книгу: верх-лево, верх-право, низ-лево, низ-право.
    next: N4_fragment

  N4_fragment:
    mode: info
    text: |
      Фрагмент 4 из 6:

         ██████  НАБЛЮДАЙ  ██████
    next: hub

  # ============================== N5 ==============================
  N5_intro:
    mode: info
    text: |
      ┌─ Узел 5 · СЧЁТ ─┐

      Три разных файла из одного расчёта. Похоже, автор везде доверял
      порядку больше, чем внешнему виду.
    image: artifact_5a.png
    next: N5_bin

  N5_bin:
    mode: auto
    text: |
      Верхняя строка выглядит как шум, но слишком ровно разбита на группы. Что в ней?
    accept:
      - "МОДУЛЬ"
      - "модуль"
    hint: |
      Каждая пачка из 6 бит — номер буквы. А=000001. 011101 = 13 = М.
    next: N5_sq

  N5_sq:
    mode: auto
    text: |
      В квадрате буквы спорят с числами. Какая сторона задаёт порядок?
    accept:
      - "ЧИСЛО"
      - "число"
    hint: |
      Клетка с «1» — первая буква, с «2» — вторая. XXXX в конце — мусор.
    next: N5_htmlinfo

  N5_htmlinfo:
    mode: info
    text: |
      Следующий файл открывается без ошибок — и почти ничего не показывает.
    document: artifact_5b.html
    next: N5_html

  N5_html:
    mode: auto
    text: |
      Что осталось за видимой страницей?
    accept:
      - "ЛОК"
      - "лок"
    hint: |
      <!-- HEX UTF-8: d0bb d0be d0ba -->  → Л О К
    next: N5_lockinfo

  N5_lockinfo:
    mode: info
    text: |
      Последняя пластина повторяет знакомый рост. Начало у него бесполезно.
    image: artifact_5c.png
    next: N5_lock

  N5_lock:
    mode: auto
    text: |
      Какой код закрывает этот узел?
    accept:
      - "2358"
      - "2 3 5 8"
    hint: |
      1 1 2 3 5 8 13 21. Единицы отбрось. Следующие четыре: 2, 3, 5, 8.
    next: N5_fragment

  N5_fragment:
    mode: info
    text: |
      Фрагмент 5 из 6:

         ██████  ВЫЧИСЛИ  ██████
    next: hub

  # ============================== N6 ==============================
  N6_intro:
    mode: info
    text: |
      ┌─ Узел 6 · ЧЕТЫРЕ ЩЕКОЛДЫ ─┐

      На доске четыре строки, но начать можно только с верхней.
      Остальные будто ждут, пока ты принесёшь им слово.
    image: artifact_6a.png
    next: N6_a1

  N6_a1:
    mode: auto
    text: |
      Первая строка притворяется просто числами. Что она говорит?
    accept:
      - "ЯНЮЯЗ"
      - "янюяз"
    hint: |
      32-14-31-32-08. Я=32, Н=14, Ю=31, Я=32, З=08.
    next: N6_at

  N6_at:
    mode: auto
    text: |
      Получившееся слово выглядит бессмысленно. Возможно, ты смотришь
      на алфавит только с одной стороны.
    accept:
      - "АТБАШ"
      - "атбаш"
    hint: |
      А↔Я, Б↔Ю, В↔Э … З↔И. ЯНЮЯЗ → АТБАШ.
    next: N6_rail

  N6_rail:
    mode: auto
    text: |
      Третья строка разошлась по нескольким уровням. Какое имя она прячет?
    accept:
      - "ВИЖНЕР"
      - "вижнер"
      - "виженер"
      - "ВИЖЕНЕР"
    hint: |
