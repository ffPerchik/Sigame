# ARG «Аргус-1001» — хаб, 6 независимых узлов.
# Уличная точка: у стадии qr: true и accept: ["КОД"], затем python bot/make_qr.py
entry_code: "ARGUS1001"

# [23:41:07] NETWORK INTERFACE: ACTIVE
# [23:41:09] ESTABLISHING SECURE HANDSHAKE...
# [23:41:11] HANDSHAKE ACCEPTED
# [23:41:14] ROUTING TRAFFIC THROUGH RELAY NODES
# [23:41:18] TARGET GATEWAY DETECTED
# [23:41:21] AUTHORIZATION STATUS: UNKNOWN
# [23:41:26] ACCESS REQUEST PENDING...
# [23:41:31] SESSION TOKEN ACQUIRED
# [23:41:33] ENCRYPTED CHANNEL: ONLINE
# [23:41:37] INTERNAL NETWORK MAP LOADED
# [23:41:42] WARNING: UNUSUAL ACTIVITY DETECTED
# [23:41:45] COUNTERMEASURES INITIALIZING
# [23:41:49] RE-Routing CONNECTION...
# [23:41:54] CONNECTION STABILIZED
# [23:41:58] DATA STREAM: 18% COMPLETE
# [23:42:06] DATA STREAM: 47% COMPLETE
# [23:42:13] DATA STREAM: 83% COMPLETE
# [23:42:17] TRANSFER COMPLETE
# [23:42:19] TERMINATING SESSION...
# [23:42:22] TRACE STATUS: CLEAR
# [23:42:25] CONNECTION CLOSED

welcome:
  text: |
    Привет. Это Женя.

    Если ты это читаешь, то ты добрался до квеста, молодец!!!



nodes:
  N1: {label: "СЛОИ СНИМКА", hint: "надпись · файл · хвост"}
  N2: {label: "ЭХО", hint: "реверс · морзе · спектр · журнал"}
  N3: {label: "ТЕТРАДЬ", hint: "знаки · зигзаг · ключ · книга"}
  N4: {label: "ОДИН КАДР", hint: "вывески · вспышка · обломки"}
  N5: {label: "СЧЁТ", hint: "биты · квадрат · исходник · замок"}
  N6: {label: "ЧЕТЫРЕ ЩЕКОЛДЫ", hint: "числа · зеркало · рельсы · ключ"}

stages:

  start_gate:
    mode: gate
    text: |
      Ок, ты на месте. Жди, пока я подтвержу старт всем сразу.

  z_1:
    mode: info
    text: |
      Это мой первый опыт, я очень старался, да, сначала будет просто, но мы разгонемся, обещаю!!!

      Ну что же, давай начнём:

      +1 без Ё:
      РСЙГЖУ
    accept:
      - "ПРИВЕТ"
      - "привет"
    hint: |
      Каждую букву сдвинь на одну назад. Р→П, С→Р, Й→И, Г→В, Ж→Е, У→Т.
    next: a_hear    

  a_1:
    mode: info
    text: |
      [23:41:07] NETWORK INTERFACE: ACTIVE
      [23:41:09] ESTABLISHING SECURE HANDSHAKE...
      [23:41:11] HANDSHAKE ACCEPTED

      …вы слышите нас?
      .
      .
      .
    next: z_c2

  z_2:
    mode: info
    text: |
      ээ-м... это не я писал... лаг какой-то... Да ладно, неважно

      Уже что-то поинтереснее: 17-6-18-25-10-12
    accept:
      - "перчик"
      - "ПЕРЧИК"
    hint: |
      числа в буквы, номер в алфавите
    next: a_2

  a_2:
    mode: info
    text: |
      ARGVS // handshake 25%
      [23:41:14] ROUTING TRAFFIC THROUGH RELAY NODES
      [23:41:18] TARGET GATEWAY DETECTED
      [23:41:21] AUTHORIZATION STATUS: UNKNOWN
      [23:41:26] ACCESS REQUEST PENDING...
      [23:41:31] SESSION TOKEN ACQUIRED
      [23:41:33] ENCRYPTED CHANNEL: ONLINE
      ...
      ....канал нестабилен
    next: z_3

  z_3:
    mode: info
    text: |
      Чё, какой 25? 25% чего? Какой к чёрту канал, ты тоже видишь эти сообщения? 
      Я сейчас перезапущу бота. подожди, вот ещё одна задачка, пока перезапускается.

    document: z_3.png
    next: bot_1

  bot_1:
    mode: auto
    text: |
      🤖 Бот @Zengame_checker_bot запущен. HOST=Женя. Жду команд.
    accept:
      - "zengame"
      - "ZENGAME"
    hint: |
      Да, надо просто прочитать, что скрыто на картинке.
    next: a_3

  a_3:
    mode: info
    text: |
      ARGVS // inject 50%
      
    next: z_fix50

  z_fix50:
    mode: info
    text: |
      Женя: я откатываю апдейт, не пишите в чат что «взлом». это баг.
      Цезарь снова, сдвиг +1: ТУБСУ
    next: z_c3

  z_c3:
    mode: auto
    text: |
      Слово.
    accept:
      - "СТАРТ"
      - "старт"
    hint: |
      На одну назад: Т→С, У→Т, Б→А, С→Р, У→Т.
    next: z_p75

  z_p75:
    mode: info
    text: |
      ARGVS // overwrite 75%
      Женя, отойди от канала
    next: z_fix75

  z_fix75:
    mode: info
    text: |
      Женя: отойти от какого канала. это мой бот.

      Ладно, последняя школьная. Морзе: -.. .-
    next: z_morse_easy

  z_morse_easy:
    mode: auto
    text: |
      Две буквы. Точка-тире, не надо Audacity.
    accept:
      - "ДА"
      - "да"
    hint: |
      Д = -..   А = .-
    next: z_p100

  z_p100:
    mode: info
    text: |
      ARGVS // 100%
      передача перехвачена
    next: z_hack

  z_hack:
    mode: info
    text: |
      Женя: нет нет нет подож—

      ┌────────────────────────────────────────────────────────────────┐
      │  ARGVS-1001 · СЕАНС ПЕРЕХВАЧЕН                                │
      └────────────────────────────────────────────────────────────────┘

      Женя больше не ведёт эту линию.

      Шесть узлов. В каждом смотри глубже, чем кажется.
      Один слой — мало. Порядок любой.
    next: hub

  # ============================== N1 ==============================
  N1_intro:
    mode: info
    text: |
      ┌─ Узел 1 · СЛОИ СНИМКА ─┐

      Мы перехватили этот кадр. Для начала проверим, что кадр дошёл до тебя.
    document: n1_card.jpg
    next: N1_flip

  N1_flip:
    mode: auto
    text: |
      Есть ли ты что-то интересное, может какая-то фраза?
    accept:
      - "СМОТРИ ВНУТРЬ"
      - "смотри внутрь"
    hint: |
      Надпись на экране монитора, зелёным. Буквы идут задом наперёд.
      Должно получиться повелительное наклонение и наречие.
    next: N1_exif

  N1_exif:
    mode: auto
    text: |
      Отлично, ты не безнадёжен, но дальше ты сам. Картинка у тебя есть, веселись.
      Подскажу в конце: внутрь — это не про пиксели.
    accept:
      - "255,217"
      - "255, 217"
      - "255 217"
      - "FFD9"
      - "ffd9"
      - "FF D9"
    hint: |
      Автор: 255,217. Это байты в десятичном виде. В hex это FF D9 —
      стандартный маркер конца JPEG. Ищи его в файле.
    next: N1_word

  N1_word:
    mode: auto
    text: |
      Что бы значили эти числа?
    accept:
      - "СЛОИ"
      - "слои"
    hint: |
      Открой jpeg через блокнот и найди строку `secret code`.
    next: N1_fragment

  N1_fragment:
    mode: info
    text: |
      Фрагмент 1 из 6:

         ██████  ОТКРОЙ  ██████
    next: hub

  # ============================== N2 ==============================
  N2_intro:
    mode: info
    text: |
      ┌─ Узел 2 · ЭХО ─┐

      Прислали аудио. Звучит как каша. Так и задумано.
    next: N2_revfile

  N2_revfile:
    mode: info
    text: |
      Скачай. Если время развернуть — там не голос.
    audio: n2_reversed.wav
    next: N2_morse

  N2_morse:
    mode: auto
    text: |
      Ну? Что там отстучали?
    accept:
      - "КЛЮЧ"
      - "ключ"
    hint: |
      Русский Морзе: К=-.-  Л=.-..  Ю=..--  Ч=---.
      Точка короткая, тире втрое длиннее. Между буквами пауза.
    next: N2_specinfo

  N2_specinfo:
    mode: info
    text: |
      Второе аудио. Глазами, не ушами.
    audio: n2_spec.wav
    next: N2_spec

  N2_spec:
    mode: auto
    text: |
      Четыре буквы. Видел?
    accept:
      - "ФИБО"
      - "фибо"
    hint: |
      Слева направо, частоты снизу вверх. Короткое слово, намёк на ряд.
    next: N2_verseinfo

  N2_verseinfo:
    mode: info
    text: |
      Журнал. Шапка не для красоты.
    image: n2_verse.png
    next: N2_echo

  N2_echo:
    mode: auto
    text: |
      Три буквы из журнала. Только не хватай всё подряд.
    accept:
      - "ЭХО"
      - "эхо"
    hint: |
      Слова 1, 2, 3: ЭТОТ ХРУПКИЙ ОТКЛИК. Не бери 5 и 8 — они для сбивки.
    next: N2_fragment

  N2_fragment:
    mode: info
    text: |
      Фрагмент 2 из 6:

         ██████  УСЛЫШЬ  ██████
    next: hub

  # ============================== N3 ==============================
  N3_intro:
    mode: info
    text: |
      ┌─ Узел 3 · ТЕТРАДЬ ─┐

      Четыре листа. Первый — вообще не буквы.
    image: n3_pigpen.png
    next: N3_pig

  N3_pig:
    mode: auto
    text: |
      Слово с первого листа. Семь букв.
    accept:
      - "РЕШЕТКА"
      - "решетка"
      - "РЕШЁТКА"
      - "решётка"
    hint: |
      Клетки без точки — первые 9 букв (А…И), с точкой — следующие.
      «Х»-семейство — дальше по алфавиту. Образец АБВ нарисован внизу.
    next: N3_railinfo

  N3_railinfo:
    mode: info
    text: |
      Лист II. Тут уже буквы, но они не в том порядке.
    image: n3_rail.png
    next: N3_rail

  N3_rail:
    mode: auto
    text: |
      Что получилось?
    accept:
      - "ВИЖНЕР"
      - "вижнер"
      - "ВИЖЕНЕР"
      - "VIGENERE"
      - "виженер"
    hint: |
      6 букв, 3 рельса. Пиши зигзагом вниз-вверх, читай по строкам — наоборот:
      разложи шифр по длинам рельсов и собери зигзагом.
      Должно получиться имя шифра (русская транслитерация).
    next: N3_viginfo

  N3_viginfo:
    mode: info
    text: |
      Лист III. Ключ у тебя уже был — с первого листа.
    image: n3_vig.png
    next: N3_vig

  N3_vig:
    mode: auto
    text: |
      Открытый текст. Одно слово.
    accept:
      - "СТРОФА"
      - "строфа"
    hint: |
      Виженер, алфавит 32 без Ё. Ключ РЕШЕТКА.
      Шифр: БЧИУЖК. На каждом шаге вычитай букву ключа.
    next: N3_bookinfo

  N3_bookinfo:
    mode: info
    text: |
      Последний лист. Цифры снизу — не страницы, а адреса.
    image: n3_book.png
    next: N3_book

  N3_book:
    mode: auto
    text: |
      Шесть букв. Сложи.
    accept:
      - "ИСТИНА"
      - "истина"
    hint: |
      1.2 иней, 2.3 свет, 3.3 тишина, 4.2 иней, 5.3 ночи, 6.2 архив.
    next: N3_fragment

  N3_fragment:
    mode: info
    text: |
      Фрагмент 3 из 6:

         ██████  ПРОЧИТАЙ  ██████
    next: hub

  # ============================== N4 ==============================
  N4_intro:
    mode: info
    text: |
      ┌─ Узел 4 · ОДИН КАДР ─┐

      Короткое видео. Почти все кадры одинаковые. Почти.
    next: N4_vid

  N4_vid:
    mode: info
    text: |
      Смотри не как кино. Как слайды.
    video: n4_walk.mp4
    next: N4_signs

  N4_signs:
    mode: auto
    text: |
      Пять букв с вывесок, слева направо.
    accept:
      - "ЛИНЗА"
      - "линза"
    hint: |
      Пять витрин, на каждой по букве. Если видео не открылось —
      кадр n4_signs.png лежит в ассетах.
    next: N4_hex

  N4_hex:
    mode: auto
    text: |
      А тот кадр, которого не должно быть — что там за слово?
    accept:
      - "ТЕНЬ"
      - "тень"
    hint: |
      Строка вида d0a2d095d09dd0ac. Декодируй как UTF-8 hex.
      Кадр один, около середины ролика.
    next: N4_shardsinfo

  N4_shardsinfo:
    mode: info
    text: |
      Ещё обломки. Собери, если руки не отвалились.
    image: n4_shards.png
    next: N4_word

  N4_word:
    mode: auto
    text: |
      Что собралось?
    accept:
      - "КАДР"
      - "кадр"
    hint: |
      Читай четверти как книгу: верх-лево, верх-право, низ-лево, низ-право.
    next: N4_fragment

  N4_fragment:
    mode: info
    text: |
      Фрагмент 4 из 6:

         ██████  НАБЛЮДАЙ  ██████
    next: hub

  # ============================== N5 ==============================
  N5_intro:
    mode: info
    text: |
      ┌─ Узел 5 · СЧЁТ ─┐

      Числа. Разные системы, один разговор.
    image: n5_table.png
    next: N5_bin

  N5_bin:
    mode: auto
    text: |
      Верхний блок. Слово?
    accept:
      - "МОДУЛЬ"
      - "модуль"
    hint: |
      Каждая пачка из 6 бит — номер буквы. А=000001. 011101 = 13 = М.
    next: N5_sq

  N5_sq:
    mode: auto
    text: |
      Квадрат. Первые пять по порядку чисел, мусор в конце выкинь.
    accept:
      - "ЧИСЛО"
      - "число"
    hint: |
      Клетка с «1» — первая буква, с «2» — вторая. XXXX в конце — мусор.
    next: N5_htmlinfo

  N5_htmlinfo:
    mode: info
    text: |
      Страница. Глазами её смотреть бесполезно.
    document: n5_ledger.html
    next: N5_html

  N5_html:
    mode: auto
    text: |
      Три буквы из того, чего не видно.
    accept:
      - "ЛОК"
      - "лок"
    hint: |
      <!-- HEX UTF-8: d0bb d0be d0ba -->  → Л О К
    next: N5_lockinfo

  N5_lockinfo:
    mode: info
    text: |
      Замок. Ряд знакомый.
    image: n5_lock.png
    next: N5_lock

  N5_lock:
    mode: auto
    text: |
      Четыре цифры подряд.
    accept:
      - "2358"
      - "2 3 5 8"
    hint: |
      1 1 2 3 5 8 13 21. Единицы отбрось. Следующие четыре: 2, 3, 5, 8.
    next: N5_fragment

  N5_fragment:
    mode: info
    text: |
      Фрагмент 5 из 6:

         ██████  ВЫЧИСЛИ  ██████
    next: hub

  # ============================== N6 ==============================
  N6_intro:
    mode: info
    text: |
      ┌─ Узел 6 · ЧЕТЫРЕ ЩЕКОЛДЫ ─┐

      Одна доска. Каждый ответ открывает следующий замок.
    image: n6_locks.png
    next: N6_a1

  N6_a1:
    mode: auto
    text: |
      Первая строка чисел. Пять букв.
    accept:
      - "ЯНЮЯЗ"
      - "янюяз"
    hint: |
      32-14-31-32-08. Я=32, Н=14, Ю=31, Я=32, З=08.
    next: N6_at

  N6_at:
    mode: auto
    text: |
      Теперь зеркало.
    accept:
      - "АТБАШ"
      - "атбаш"
    hint: |
      А↔Я, Б↔Ю, В↔Э … З↔И. ЯНЮЯЗ → АТБАШ.
    next: N6_rail

  N6_rail:
    mode: auto
    text: |
      Зигзаг на доске. Имя шифра, как в тетради.
    accept:
      - "ВИЖНЕР"
      - "вижнер"
      - "виженер"
      - "ВИЖЕНЕР"
    hint: |
      Шифртекст ВЕИНРЖ, 3 рельса — тот же приём, что лист II тетради.
    next: N6_vig

  N6_vig:
    mode: auto
    text: |
      Последний замок. Ключ — то, что было после зеркала.
    accept:
      - "ПОРТАЛ"
      - "портал"
    hint: |
      Ключ АТБАШ, шифр ПАСТШЛ, алфавит 32 без Ё.
    next: N6_fragment

  N6_fragment:
    mode: info
    text: |
      Фрагмент 6 из 6:

         ██████  ЗАВЕРШИ  ██████
    next: hub

  final_hint:
    mode: finish
    text: |
      ┌────────────────────────────────────────────────────────────────┐
      │  ARGVS-1001 · СЕАНС ЗАВЕРШЁН                                  │
      └────────────────────────────────────────────────────────────────┘

      Шесть фрагментов:

           ОТКРОЙ · УСЛЫШЬ · ПРОЧИТАЙ · НАБЛЮДАЙ · ВЫЧИСЛИ · ЗАВЕРШИ

      Это не координаты и не пароль от чужой жизни.
      Это инструкция, как смотреть дальше.

      Аргус-1001 замолчал.

       ╲╲╲          ╱╱╱
        ╲╲╲  КОНЕЦ ╱╱╱
         ╲╲╲      ╱╱╱
