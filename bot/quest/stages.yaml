# =============================================================================
#  ARG «Аргус-1001». Линейная цепочка узлов. Бот ведёт игрока шаг за шагом.
#
#  Stages:
#    prologue → N1_* → N2_* → N3_* → N4_* → N5_* → N6_* → final_hint
#
#  Каждый узел = 5-8 yaml-стадий. Подсказка (hint) тратит 1 очко из банка.
#  6 узлов, 6 фрагментов. В финале игрок видит послание «ОТКРОЙ УСЛЫШЬ
#  ПРОЧИТАЙ НАБЛЮДАЙ ВЫЧИСЛИ ЗАВЕРШИ» — итого 6 слов-фрагментов.
#
#  Медиа-файлы живут в bot/quest/images/ (image / audio / video / document).
#  QR-коды для qr-стадий делаются через bot/make_qr.py и раскладываются по
#  реальным локациям Москвы.
#
#  Шифры: 32-буквенный русский без ё (АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ).
#
#  Тест-сценарий (для проверки фич бота, в т.ч. image/audio/video) — в
#  stages_test.yaml. Чтобы загрузить его вместо основного квеста, выстави
#  в .env: QUEST_FILE=bot/quest/stages_test.yaml
#  и ENTRY_CODE=ZENGAME2026 (как в самом тест-файле).
# =============================================================================

entry_code: "ARGUS1001"
start: prologue

stages:

  # ------------------------------------------------------------------ prologue
  prologue:
    mode: info
    text: |
      ┌────────────────────────────────────────────────────────────────┐
      │  ARGVS-1001 · СЕАНС ПЕРЕХВАЧЕН                                │
      └────────────────────────────────────────────────────────────────┘

      Ты нашёл вход. Дальше — шесть узлов, каждый спрятан в своём слое:
      координаты, спектр, дневник, кадр, цифры, шифр.

      Каждый узел отдаст тебе один фрагмент послания Аргуса.
      Один — не прочесть. Все шесть — прочтёшь.

      Удачи. Не споткнись.
    next: hub

  # ----------------------------------------------------------------------- hub
  # Текст хаба строится динамически (см. bot._send_hub) — здесь только маркер.
  hub:
    mode: info
    text: "__DYNAMIC_HUB__"
    # без next: бот знает, что хаб — терминал в цепочке advance()


  # ============================================================== N1 (метаданные)
  # Идея: «Картинка с метаданными → локация». Игрок получает фотку Москвы с
  # вшитыми EXIF GPS. Извлекает координаты, узнаёт место, идёт туда, находит QR.

  N1_intro:
    mode: info
    text: |
      ┌─ Узел 1 из 6 ─┐
      │ СНИМОК С КООРДИНАТОЙ │
      └────────────────────┘

      Аргус перехватил кадр. На снимке — обычный московский пейзаж. Но
      внутри файла — координаты места, где его сняли.

      Смотри. Не сводом глаз — свойствами файла.
    image: n1_clue.jpg
    next: N1_meta

  N1_meta:
    mode: info
    text: |
      Что обычно лежит в свойствах фотографии: модель камеры, дата, выдержка.
      Но у этого снимка в EXIF есть и GPS-блок. Он-то нам и нужен.

      ▸ Windows: правый клик по файлу → Свойства → вкладка «Подробно» → раздел «Местоположение».
      ▸ macOS: открыть в «Просмотре» → Инструменты → «Показать местоположение».
      ▸ Linux / командная строка: exiftool n1_clue.jpg
      ▸ Онлайн: любой «EXIF viewer» — google.com: «view EXIF data online».

      Перепиши широту и долготу. Или сразу название места.
    next: N1_gps

  N1_gps:
    mode: info
    text: |
      Справился. Открывай карту Москвы и езжай на точку. Это в пределах
      МКАД, недалеко от метро — должно быть узнаваемое место.

      Когда доберёшься — ответь боту.
    next: N1_place

  N1_place:
    mode: auto
    text: |
      Где ты сейчас?
      Напиши название места (как пишется на карте).
    accept:
      - "Воробьёвы горы"
      - "ВОРОБЬЁВЫ ГОРЫ"
      - "Воробьевы горы"
      - "воробьевы горы"
    hint: |
      На фотографии видна смотровая площадка и панорама Москвы-реки. Если
      не угадывается — погугли «EXIF GPS Москва смотровая».
    next: N1_on_site

  N1_on_site:
    mode: info
    text: |
      Да, Воробьёвы горы. Дошёл.

      На смотровой площадке, ближе к восточному краю, есть объект, которого
      здесь быть не должно: маленький QR-код, наклеенный на лавку или
      ограждение (рядом с табличкой с названием смотровой).

      Сканируй. Или введи код, что найдёшь, текстом.
    next: N1_qr

  N1_qr:
    mode: auto
    qr: true
    text: |
      Введи код из QR (deep link или текстом).
    accept: ["ARGUS-WATCH"]
    hint: |
      Если QR не сканируется — попробуй обычную камеру телефона (не
      приложение соцсетей). Запасной код для ввода текстом: ARGUS-WATCH.
    next: N1_proof

  N1_proof:
    mode: approve
    text: |
      Доказательство посещения. Пришли боту фото с включённой геометкой,
      где видно, что ты на Воробьёвых горах (панорама, ограждение, смотровая
      вывеска). Ведущий подтвердит — и фрагмент твой.
    hint: |
      Фото не должно быть скриншотом карты. Включи геометку в камере
      (Настройки → Камера → Геотеги). Ведущий увидит координаты в EXIF.
    next: N1_fragment

  N1_fragment:
    mode: info
    text: |
      Фрагмент 1 из 6 найден. Запомни слово:

         ██████  ОТКРОЙ  ██████

      Шесть фрагментов складываются в послание Аргуса. Не потеряй его.
    next: hub

  # ================================================================ N2 (спектр)
  # Идея: «Текст в спектрограмме». Два аудиофайла, в каждом — слово, видимое
  # при открытии в Audacity / Sonic Visualiser / любом «spectrum view».

  N2_intro:
    mode: info
    text: |
      ┌─ Узел 2 из 6 ─┐
      │ ГОЛОС В СПЕКТРЕ │
      └────────────────┘

      Голос можно спрятать. Но можно и нарисовать.

      Сейчас прилетит аудиофайл. Открой его в редакторе, в котором видна
      спектрограмма — и прочитай то, что Аргус в ней нарисовал.
    next: N2_audio1

  N2_audio1:
    mode: info
    text: |
      Аудиофайл 1/2. Скачай, открой в Audacity (FOSS) / Sonic Visualiser /
      Spek / Voice-audio-Analyser на телефоне. Переключись в режим
      «Spectrogram» или «Spectral view». Назови слово, которое увидишь.
    audio: n2_audio1.wav
    next: N2_word1

  N2_word1:
    mode: auto
    text: |
      Слово из первой спектрограммы?
    accept:
      - "АРГУС"
      - "аргус"
      - "Аргус"
    hint: |
      Спектрограмма обычно читается СЛЕВА НАПРАВО и СНИЗУ ВВЕРХ (частота
      растёт вверх). Буквы большие, без засечек; пишут, как маркером.
    next: N2_audio2

  N2_audio2:
    mode: info
    text: |
      Принято. Вот второе аудио — короче, тише. Точно так же: смотри
      спектрограмму. Там другое слово.
    audio: n2_audio2.wav
    next: N2_word2

  N2_word2:
    mode: auto
    text: |
      Слово из второй спектрограммы?
    accept:
      - "СЛЕД"
      - "след"
      - "След"
    hint: |
      В этом аудио Аргус сделал слово покороче — четыре буквы.
    next: N2_fragment

  N2_fragment:
    mode: info
    text: |
      Фрагмент 2 из 6 найден. Запомни слово:

         ██████  УСЛЫШЬ  ██████

      Спектр — не шум. Это ещё одна гласная Аргуса. Дальше.
    next: hub

  # =========================================================== N3 (дневник)
  # Идея: «Дневник с шифром». Страница «найденного дневника», на которой
  # русский текст заменён через простую подстановку. Внизу — ключ-алфавит.
  # Вторая страница — чуть глубже: ключ надо вывести из контекста.

  N3_intro:
    mode: info
    text: |
      ┌─ Узел 3 из 6 ─┐
      │ ДНЕВНИК С ТРЕМЯ АЛФАВИТАМИ │
      └────────────────────────────┘

      Кто-то оставил тетрадь. Текст записан не буквами — знаками. Внизу —
      шпаргалка: алфавит-ключ. Заменяй знаки на буквы по таблице и читай.
    image: n3_page1.png
    next: N3_key

  N3_key:
    mode: info
    text: |
      Это простой шифр простой замены: каждая буква заменена на другой
      символ. Под картинкой — строчка-ключ, вида
        А=Г  Б=П  В=М  …
      значит буква А в тексте нарисована как Г, буква Б — как П, и так
      далее. Записывай, как табличку подстановки, и переводи посимвольно.

      Ручкой на бумаге быстрее.
    next: N3_word1

  N3_word1:
    mode: auto
    text: |
      Расшифровал первую страницу. Там одно ёмкое слово. Введи его.
    accept:
      - "ИЩИ"
      - "ищи"
      - "Ищи"
    hint: |
      Слово — повелительное наклонение, три буквы, вторая «Щ».
    next: N3_page2

  N3_page2:
    mode: info
    text: |
      Понял. Вторая страница того же дневника — глубже. Здесь подстановки
      нет, но буквы переставлены местами. Указан номер страницы в дневнике
      (он же смещение). Примени смещение и прочитай.
    image: n3_page2.png
    next: N3_word2

  N3_word2:
    mode: auto
    text: |
      Расшифровал вторую страницу. Какое слово там выделено?
    accept:
      - "СВЕТ"
      - "свет"
      - "Свет"
    hint: |
      На странице есть указание: «со сдвигом N». Подставь N в каждую букву
      по кругу русского алфавита БЕЗ Ё (32 буквы, идём по кругу). Получится
      короткое существительное.
    next: N3_fragment

  N3_fragment:
    mode: info
    text: |
      Фрагмент 3 из 6 найден. Запомни слово:

         ██████  ПРОЧИТАЙ  ██████

      Дневник — печатный станок Аргуса.
    next: hub

  # ============================================================== N4 (видео)
  # Идея: «Видео-прогулка → найди метки в кадре». Игрок получает видео (файл
  # или ссылка), в котором в определённых кадрах мелькает «СВЕТ» / слово /
  # символ. Он должен его вычленить и назвать.

  N4_intro:
    mode: info
    text: |
      ┌─ Узел 4 из 6 ─┐
      │ КАРТА ПОД НОГАМИ │
      └─────────────────┘

      Аргус записал короткий маршрут по городу. Видео ляжет сюда файлом —
      ты его откроешь у себя на устройстве.

      Что-то странное в кадре. У одного объекта в одном из кадров
      должна быть подсказка. Смотри внимательно, делай скриншоты.
    next: N4_video

  N4_video:
    mode: info
    text: |
      ▶ Видео-запись (3–5 минут прогулки). Сохрани, если нужно, открой во
      встроенном плеере устройства. На паузе можно пролистать по кадрам.
    video: n4_walk.mp4
    next: N4_capture

  N4_capture:
    mode: info
    text: |
      Что ты увидел в кадре? Опиши в одном-двух словах тот объект, где
      спрятан знак. Тебе нужно конкретное слово из этого объекта.
    next: N4_word

  N4_word:
    mode: auto
    text: |
      Назови слово, которое увидел на табличке / стене / асфальте / вывеске /
      объекте из видео.
    accept:
      - "СВЕТ"
      - "свет"
      - "Свет"
    hint: |
      Пролистай видео покадрово. Слово вспыхивает на 1–2 секунды на
      конкретном носителе информации. Цвет обычно красный или жёлтый.
    next: N4_fragment

  N4_fragment:
    mode: info
    text: |
      Фрагмент 4 из 6 найден. Запомни слово:

         ██████  НАБЛЮДАЙ  ██████

      Глаз Аргуса ходит по городу. И твой теперь тоже.
    next: hub

  # ============================================================== N5 (цифры)
  # Идея: «Числовые улики → координаты». Игрок видит таблицу чисел, дат,
  # времён; нужно применить модулярную арифметику (или «часы», mod 60/24/
  # 360) и получить координаты реального места в Москве.

  N5_intro:
    mode: info
    text: |
      ┌─ Узел 5 из 6 ─┐
      │ ЦИФРОВАЯ ТЕНЬ │
      └───────────────┘

      Аргус оставил числа. Не время, не цены. Координаты — но замаскированные
      арифметикой.
    image: n5_table.png
    next: N5_method

  N5_method:
    mode: info
    text: |
      Перед тобой три столбца: ЧАСЫ, МИНУТЫ, СЕКУНДЫ. Все три — двузначные.
      Так Аргус записал широту и долготу одной точки в Москве.

      Чтобы получить координаты в формате «55.xxxx, 37.xxxx», возьми
      десятичную дробь и поставь её после «55.». То есть:
        ШИРОТА  = 55. + (ЧАСЫ × 60 + МИНУТЫ) / 3600
        ДОЛГОТА = 37. + (ЧАСЫ × 60 + СЕКУНДЫ) / 3600
      (где «ЧАСЫ» во второй формуле — часы из второго ряда таблицы.)

      Посчитай. Это где-то в центре Москвы, дойдёшь пешком.
    next: N5_decoded

  N5_decoded:
    mode: auto
    text: |
      Какие координаты получились? Введи в формате «<широта>, <долгота>»
      через запятую.
    accept:
      - "55.7333, 37.5833"
      - "55.7333,37.5833"
      - "55.7333  37.5833"
    hint: |
      Проверь: ЧАСЫ — двухзначные числа от 00 до 23. Считай внимательно.
      Если не сходится — обычно ошибка в одном из трёх столбцов на 1.
    next: N5_arrived

  N5_arrived:
    mode: info
    text: |
      Это Лужники. Южная часть, ближе к метро. Там у одной из опор
      освещения наклеен QR.

      Сканируй. Или введи код, что найдёшь, текстом.
    next: N5_qr

  N5_qr:
    mode: auto
    qr: true
    text: |
      Введи код из QR.
    accept: ["ARGUS-LUZHNIKI"]
    hint: |
      Объект рядом с центральной аллеей, не главная сцена. Запасной код
      для ввода текстом: ARGUS-LUZHNIKI.
    next: N5_fragment

  N5_fragment:
    mode: info
    text: |
      Фрагмент 5 из 6 найден. Запомни слово:

         ██████  ВЫЧИСЛИ  ██████

      Числа — тоже алфавит Аргуса.
    next: hub

  # ============================================================= N6 (шифры)
  # Цепочка из двух обратимых шагов:
  #   plain "СВЕТ" --(+5 Цезарь)--> "ЦЗКЧ" --(A1Z26)--> "23-08-11-24"
  # Игрок идёт в обратную сторону: сначала A1Z26, потом Цезарь -5.

  N6_intro:
    mode: info
    text: |
      ┌─ Узел 6 из 6 ─┐
      │ КЛЮЧ ЗА ШИФРОМ │
      └─────────────────┘

      Аргус спрятал последний кусок цепочкой: цифры → буквы → сдвиг.
      На картинке — зашитая строка + шпаргалка-порядок. Снимай замки по
      очереди.
    image: n6_cipher.png
    next: N6_res1

  N6_res1:
    mode: auto
    text: |
      Шаг 1. На картинке — числа через дефис: «23-08-11-24». Это позиции букв
      в 32-буквенном русском алфавите БЕЗ Ё (А=1, Б=2, …, Я=32). Переведи
      числа в буквы по порядку и введи получившееся 4-буквенное слово.
    accept:
      - "ЦЗКЧ"
      - "цзкч"
    hint: |
      А=1, Б=2, В=3, Г=4, Д=5, Е=6, Ж=7, З=8, И=9, Й=10, К=11, Л=12,
      М=13, Н=14, О=15, П=16, Р=17, С=18, Т=19, У=20, Ф=21, Х=22, Ц=23,
      Ч=24, Ш=25, Щ=26, Ъ=27, Ы=28, Ь=29, Э=30, Ю=31, Я=32.
    next: N6_step2

  N6_step2:
    mode: info
    text: |
      Теперь сдвиг Цезаря. На картинке указано: «каждая буква смещена на +5
      по русскому алфавиту без ё». Значит, чтобы вернуть букву на место,
      отними 5. Делай — это будет финальное слово узла.
    next: N6_res2

  N6_res2:
    mode: auto
    text: |
      Шаг 2. Что получилось после сдвига на −5?
    accept:
      - "СВЕТ"
      - "свет"
      - "Свет"
    hint: |
      Циферки от 1 до 32, по кругу. Если буква была на позиции X, она
      «родом» с позиции (X − 5) по тому же кругу.
    next: N6_fragment

  N6_fragment:
    mode: info
    text: |
      Фрагмент 6 из 6 найден. Запомни слово:

         ██████  ЗАВЕРШИ  ██████

      Аргус-1001 замолчал.
    next: hub

  # ================================================================ final
  final_hint:
    mode: finish
    text: |
      ┌────────────────────────────────────────────────────────────────┐
      │  ARGVS-1001 · СЕАНС ЗАВЕРШЁН                                  │
      └────────────────────────────────────────────────────────────────┘

      Шесть фрагментов сложились в послание:

           ОТКРОЙ · УСЛЫШЬ · ПРОЧИТАЙ · НАБЛЮДАЙ · ВЫЧИСЛИ · ЗАВЕРШИ

      Это и было послание. Не любовное письмо, не координаты. Инструкция.

      Аргус-1001 передаёт привет.

      ╲╲╲          ╱╱╱
       ╲╲╲  КОНЕЦ ╱╱╱
        ╲╲╲      ╱╱╱
