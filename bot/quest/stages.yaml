# =============================================================================
#  Квест. Редактируй под себя — это пример, демонстрирующий все режимы.
#
#  Поля стадии:
#    mode:   info    — просто текст, бот сам переходит к next
#            auto    — игрок присылает ответ; бот сверяет с accept (сам)
#            approve — игрок шлёт фото/файл/текст; ведущий апрувит (кнопки/команды)
#            finish   — финиш
#    text:   что показать игроку
#    accept: список принимаемых ответов (для auto). Регистр/ё/пунктуация не важны.
#    qr:     true — стадия-локация с QR; accept[0] — код в QR (deep link)
#    hint:   текст подсказки (/hint)
#    next:   следующая стадия
#    image:  (опц.) путь к картинке в папке бота
# =============================================================================

entry_code: "ZENGAME2026"
start: intro

stages:
  intro:
    mode: info
    text: |
      🎩 Ты принял вызов. Дальше — индивидуальный квест: шифры, QR на реальных
      точках, доказательства. Каждый идёт сам за себя.
      Подсказки есть (/hint), но они учитываются в финальном счёте.
      Удачи. Первый шаг — простой шифр.
    next: caesar

  caesar:
    mode: auto
    text: |
      Расшифруй (шифр Цезаря, сдвиг +3 — сдвинь каждую букву НАЗАД на 3):
      «ЫЛЧУ»
    accept: ["шифр", "шифр!"]
    hint: "Алфавит с Ё: Ш→Ы, значит наоборот Ы→Ш. Примени ко всем буквам."
    next: qr_spot1

  qr_spot1:
    mode: auto
    qr: true
    text: |
      🔎 Локация №1. Найди QR-код (ведущий подскажет где) и отсканируй его —
      откроется ссылка на меня, и шаг засчитается.
      Нет сканера? Введи код с QR вручную текстом.
    accept: ["SPOT1"]
    hint: "QR спрятан там, где..."
    next: proof1

  proof1:
    mode: approve
    text: |
      📸 Отлично, точка найдена! Пришли фото-доказательство (ты на месте ИЛИ
      найденный предмет). Ведущий проверит и пропустит дальше.
    next: riddle

  riddle:
    mode: auto
    text: |
      Последний шаг — загадка на логику.
      У матери шесть сыновей, и у каждого из них по одной сестре.
      Сколько всего детей у матери?
    accept: ["7", "семь", "семерых"]
    hint: "Сестра у всех одна и та же."
    next: finish

  finish:
    mode: finish
    text: |
      🏆 Поздравляю — ты прошёл квест!
      Сообщи ведущему о финишe. Победитель — по скорости и числу подсказок.
